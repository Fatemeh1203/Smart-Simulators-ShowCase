<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>در حال باز کردن آزمایشگاه مجازی…</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="refresh" content="3; url=https://019ee97c-c444-7eb2-8256-675883abeeb3.arena.site/">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#2b333d;
    --text:#e6edf3;
    --muted:#9aa7b4;
    --accent:#2f81f7;
    --accent-hover:#4b95f9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Tahoma,"Iranian Sans",system-ui,-apple-system,sans-serif;
    line-height:1.9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .box{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:36px 24px;
    text-align:center;
  }
  h1{font-size:20px;margin:0 0 10px}
  p{margin:0 0 24px;color:var(--muted);font-size:15px}
  .spinner{
    width:34px;
    height:34px;
    margin:0 auto 22px;
    border:3px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    padding:12px 32px;
    border-radius:10px;
    transition:background .15s ease;
  }
  .btn:hover,.btn:focus-visible{background:var(--accent-hover)}
  .back{display:block;margin-top:18px;font-size:13px;color:var(--muted);text-decoration:none}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>در حال باز کردن آزمایشگاه مجازی…</h1>
    <p>چند لحظه صبر کنید. اگر صفحه به‌طور خودکار باز نشد، روی دکمهٔ زیر کلیک کنید.</p>
    <a class="btn" href="https://019ee97c-c444-7eb2-8256-675883abeeb3.arena.site/">ورود به شبیه‌ساز</a>
    <a class="back" href="index.html">بازگشت به صفحهٔ اصلی</a>
  </div>

<script>
  setTimeout(function () {
    window.location.replace('https://019ee97c-c444-7eb2-8256-675883abeeb3.arena.site/');
  }, 700);
</script>
</body>
</html>
