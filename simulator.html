<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمایشگاه مجازی — Smart Simulators ShowCase</title>
<meta name="referrer" content="no-referrer">
<style>
  :root{
    --bg:#0d1117;
    --bar:#161b22;
    --border:#2b333d;
    --text:#e6edf3;
    --muted:#9aa7b4;
    --accent:#2f81f7;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Tahoma,"Iranian Sans",system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 16px;
    background:var(--bar);
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  header a{color:var(--accent);text-decoration:none}
  header a:hover{text-decoration:underline}
  header strong{font-weight:600}
  .stage{flex:1 1 auto;position:relative;min-height:0}
  iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fff;
  }
  #fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:24px;
    text-align:center;
    background:var(--bg);
  }
  #fallback.show{display:flex}
  #fallback p{margin:0;color:var(--muted);font-size:15px;line-height:1.9}
  #fallback a{
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    padding:12px 28px;
    border-radius:10px;
  }
</style>
</head>
<body>
<header>
  <a href="index.html">&#8594; بازگشت</a>
  <strong>آزمایشگاه مجازی</strong>
</header>

<div class="stage">
  <iframe
    id="lab"
    src="https://019ee97c-c444-7eb2-8256-675883abeeb3.arena.site/"
    title="آزمایشگاه مجازی"
    allow="accelerometer; camera; microphone; clipboard-write; fullscreen; gyroscope; xr-spatial-tracking"
    allowfullscreen></iframe>

  <div id="fallback">
    <p>
      بارگذاری شبیه‌ساز در این صفحه بیش از حد طول کشید.<br>
      می‌توانید آن را در یک پنجرهٔ جدید باز کنید.
    </p>
    <a id="direct" href="https://019ee97c-c444-7eb2-8256-675883abeeb3.arena.site/" target="_blank" rel="noopener">
      باز کردن شبیه‌ساز در پنجرهٔ جدید
    </a>
  </div>
</div>

<script>
  var loaded = false;
  document.getElementById('lab').addEventListener('load', function () {
    loaded = true;
  });
  setTimeout(function () {
    if (!loaded) {
      document.getElementById('fallback').classList.add('show');
    }
  }, 15000);
</script>
</body>
</html>
