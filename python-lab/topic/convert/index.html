"code\":\"a = 5\\nb = float(a)\\nprint(b, type(b))\\nc = 3.7\\nd = int(c)\\nprint(d, type(d))\",\"explanation\":\"int به float با اضافه کردن .0 تبدیل می‌شود. float به int فقط قسمت صحیح را نگه می‌دارد (گرد نمی‌کند، فقط قطع می‌کند!).\",\"expectedOutput\":\"5.0 \u003cclass 'float'\u003e\\n3 \u003cclass 'int'\u003e\",\"tip\":\"int(3.7) = 3 نه 4! برای گرد کردن از round() استفاده کن.\"},{\"id\":\"conv-5\",\"title\":\"تبدیل به bool\",\"story\":\"در پایتون، صفر و رشته خالی False هستند، بقیه True! 🚦\",\"code\":\"print(bool(0))\\nprint(bool(1))\\nprint(bool(\\\"\\\"))\\nprint(bool(\\\"سلام\\\"))\\nprint(bool(-5))\",\"explanation\":\"bool(0)=False, bool(1)=True, bool('') = False, bool('هرچیز') = True. فقط صفر و خالی False هستند!\",\"expectedOutput\":\"False\\nTrue\\nFalse\\nTrue\\nTrue\",\"tip\":\"این ویژگی در شرط‌ها خیلی کاربرد دارد.\"},{\"id\":\"conv-6\",\"title\":\"خطای تبدیل نامعتبر\",\"story\":\"بعضی تبدیل‌ها ممکن نیست! پایتون خطا می‌دهد. ⚠️\",\"code\":\"try:\\n    x = int(\\\"سلام\\\")\\nexcept ValueError:\\n    print(\\\"خطا: این متن عدد نیست!\\\")\\n\\ny = int(\\\"12.5\\\")  # این هم خطا می‌دهد\",\"explanation\":\"int('سلام') خطا می‌دهد چون 'سلام' عدد نیست. همچنین int('12.5') خطا می‌دهد چون نقطه دارد (برای این باید اول float کنیم).\",\"expectedOutput\":\"خطا: این متن عدد نیست!\",\"tip\":\"در برنامه واقعی، بهتر است با try-except خطا را مدیریت کنیم.\"}],\"quiz\":[{\"id\":1,\"question\":\"خروجی int('50') چیست؟\",\"options\":[\"'50'\",\"50\",\"50.0\",\"خطا\"],\"correctIndex\":1,\"explanation\":\"int() رشته '50' را به عدد صحیح 50 تبدیل می‌کند.\"},{\"id\":2,\"question\":\"خروجی str(123) چیست؟\",\"options\":[\"123\",\"'123'\",\"خطا\",\"123.0\"],\"correctIndex\":1,\"explanation\":\"str() عدد را به رشته تبدیل می‌کند. نتیجه '123' است.\"},{\"id\":3,\"question\":\"خروجی int(7.8) چیست؟\",\"options\":[\"7\",\"8\",\"7.8\",\"خطا\"],\"correctIndex\":0,\"explanation\":\"int() فقط قسمت صحیح را نگه می‌دارد (بدون گرد کردن). 7.8 → 7.\"},{\"id\":4,\"question\":\"کدام تبدیل خطا می‌دهد؟\",\"op
