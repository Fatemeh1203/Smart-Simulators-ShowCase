<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Basics — Fatemeh Shams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --brand:#2C6A9E; --brand-2:#3776AB; --accent:#FFD43B; --accent-ink:#6B5200;
  --bg:#E9EFF6; --surface:#FFFFFF; --surface-2:#F4F8FC; --border:#D5DFEA;
  --text:#0E1722; --dim:#5A6A7D; --brand-soft:#E3EFF9;
  --ok:#177F51; --ok-soft:#E1F5EC; --bad:#BF2D36; --bad-soft:#FCE8E9;
  --term-bg:#0E1621; --term-fg:#D9E4F0; --term-line:#1E2B3A;
  --shadow:0 1px 2px rgba(16,30,48,.06), 0 8px 24px -12px rgba(16,30,48,.18);
  --shadow-lg:0 24px 60px -24px rgba(16,30,48,.35);
  --r:14px; --r-sm:9px;
  --display:'Space Grotesk','Vazirmatn',system-ui,sans-serif;
  --body:'Inter','Vazirmatn',system-ui,sans-serif;
  --mono:'JetBrains Mono','Vazirmatn',ui-monospace,Menlo,Consolas,monospace;
  --rail:280px;
}
html[data-theme="dark"]{
  --brand:#5AA7E0; --brand-2:#7CBCEC; --accent:#FFD43B; --accent-ink:#1A1400;
  --bg:#080D14; --surface:#111A24; --surface-2:#16212D; --border:#25333F;
  --text:#E7EEF6; --dim:#93A5B8; --brand-soft:#132738;
  --ok:#3DD68C; --ok-soft:#0F2A20; --bad:#FF7076; --bad-soft:#2C1418;
  --term-bg:#050A10; --term-fg:#D9E4F0; --term-line:#1A2534;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.85);
}
html[lang="fa"]{ --display:'Vazirmatn',sans-serif; --body:'Vazirmatn',sans-serif; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--display); line-height:1.2; margin:0; letter-spacing:-.015em}
html[lang="fa"] h1,html[lang="fa"] h2,html[lang="fa"] h3{letter-spacing:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:#1A1400}

/* ============ TOP BAR ============ */
.top{
  position:sticky; top:0; z-index:60; height:62px;
  display:flex; align-items:center; gap:14px; padding:0 16px;
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:saturate(1.5) blur(14px);
  border-bottom:1px solid var(--border);
}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.brandmark svg{width:30px;height:30px;flex:none}
.brandtxt{min-width:0}
.brandtxt b{display:block;font-family:var(--display);font-size:15px;font-weight:700;line-height:1.15;white-space:nowrap}
.brandtxt span{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;letter-spacing:.02em}
.spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;
  border:1px solid var(--border); border-radius:10px; background:var(--surface);
  font-size:13px; font-weight:600; color:var(--text); transition:.16s;
}
.tbtn:hover{border-color:var(--brand);color:var(--brand)}
.tbtn svg{width:16px;height:16px}
.menu-btn{display:none}

/* ============ SHELL ============ */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;align-items:start}
.rail{
  position:sticky; top:62px; height:calc(100vh - 62px); overflow-y:auto;
  border-inline-end:1px solid var(--border); background:var(--surface);
  padding:16px 12px 40px; scrollbar-width:thin;
}
.rail-h{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);padding:0 10px;margin:14px 0 8px;
}
html[lang="fa"] .rail-h{letter-spacing:0}
.prog-wrap{padding:10px 10px 4px}
.prog-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:600}
.prog-bar{height:7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* lesson chain */
.chain{position:relative;padding-inline-start:6px}
.chain::before{
  content:'';position:absolute;inset-block:16px;inset-inline-start:22px;width:2px;
  background:var(--border);border-radius:2px;
}
.navitem{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  padding:7px 10px;border-radius:10px;text-align:start;transition:.15s;
}
.navitem:hover{background:var(--surface-2)}
.navitem.on{background:var(--brand-soft)}
.navitem.on .nv-t{color:var(--brand);font-weight:650}
.nv-n{
  position:relative;z-index:1;flex:none;width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;
  background:var(--surface);border:2px solid var(--border);color:var(--dim);transition:.2s;
}
.navitem.on .nv-n{border-color:var(--brand);color:var(--brand)}
.navitem.done .nv-n{background:var(--accent);border-color:var(--accent);color:#4A3A00}
.nv-t{font-size:13.2px;line-height:1.35;color:var(--text)}
.nv-s{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--dim)}
.navitem.done .nv-s{color:var(--ok)}
.navitem.flat{padding-inline-start:10px}
.navitem.flat .nv-n{border-style:solid;background:var(--surface-2)}

/* ============ MAIN ============ */
main{padding:0 0 80px;min-width:0}
.wrap{max-width:980px;margin:0 auto;padding:26px 22px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);
  background:var(--brand-soft);padding:5px 10px;border-radius:7px;
}
html[lang="fa"] .eyebrow{letter-spacing:0;font-family:var(--body)}
.h-title{font-size:clamp(26px,4.2vw,38px);font-weight:700;margin:14px 0 8px}
.h-sub{color:var(--dim);font-size:15.5px;max-width:64ch;margin:0}

/* tabs */
.tabs{display:flex;gap:4px;margin:22px 0 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{
  padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--dim);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .pill{font-family:var(--mono);font-size:10px;background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:5px;margin-inline-start:6px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.blk{margin:22px 0}
.blk h3{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.blk h3::before{content:'';width:7px;height:18px;border-radius:3px;background:var(--accent);flex:none}
.blk p{margin:0 0 12px;color:var(--text)}
.blk p code, .ic{
  font-family:var(--mono);font-size:.88em;background:var(--brand-soft);color:var(--brand);
  padding:1.5px 6px;border-radius:6px;direction:ltr;display:inline-block;
}
.note{
  border-inline-start:3px solid var(--accent);background:var(--surface-2);
  padding:12px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:14px;margin:14px 0;
}
html[dir="rtl"] .note{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.note b{color:var(--accent-ink)}
html[data-theme="dark"] .note b{color:var(--accent)}

/* terminal / code */
.term{background:var(--term-bg);border-radius:var(--r);overflow:hidden;border:1px solid var(--term-line);direction:ltr}
.term-bar{
  display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--term-line);
  background:rgba(255,255,255,.03);
}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:99px;display:block}
.dots i:nth-child(1){background:#FF5F57}.dots i:nth-child(2){background:var(--accent)}.dots i:nth-child(3){background:#28C840}
.term-name{font-family:var(--mono);font-size:11.5px;color:#7D8FA3;margin-inline-start:4px}
.term-acts{margin-inline-start:auto;display:flex;gap:6px}
.mini{
  font-family:var(--mono);font-size:11px;font-weight:600;color:#9FB2C6;border:1px solid var(--term-line);
  padding:4px 9px;border-radius:7px;transition:.15s;background:rgba(255,255,255,.02);
}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.run{color:#0E1621;background:var(--accent);border-color:var(--accent)}
.mini.run:hover{filter:brightness(1.08);color:#0E1621}
pre.code{
  margin:0;padding:15px 17px;overflow-x:auto;font-family:var(--mono);font-size:13.2px;
  line-height:1.75;color:var(--term-fg);tab-size:4;
}
pre.code .k{color:#FF7BB0}.code .s{color:#9BE59B}.code .n{color:#FFD43B}
.code .c{color:#5F7183;font-style:italic}.code .f{color:#7CC7FF}.code .b{color:#C6A5FF}
.out{border-top:1px dashed var(--term-line);background:rgba(255,212,59,.045);padding:12px 17px}
.out-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#7D8FA3;text-transform:uppercase;margin-bottom:5px}
.out pre{margin:0;font-family:var(--mono);font-size:13px;color:#EAF2A0;white-space:pre-wrap;line-height:1.7}

/* editor */
.edwrap{display:flex;background:var(--term-bg);min-height:230px}
.gutter{
  padding:15px 0 15px;width:44px;flex:none;text-align:end;font-family:var(--mono);font-size:12.5px;
  line-height:1.75;color:#41505F;user-select:none;border-inline-end:1px solid var(--term-line);
  padding-inline-end:9px;overflow:hidden;
}
.ed{
  flex:1;background:transparent;border:none;resize:vertical;padding:15px 17px;
  font-family:var(--mono);font-size:13.2px;line-height:1.75;color:var(--term-fg);
  outline:none;min-height:230px;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
.console{background:#060B11;border-top:1px solid var(--term-line);padding:13px 17px;min-height:74px;max-height:320px;overflow:auto}
.console pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.7;color:#CFE0F0;white-space:pre-wrap}
.console .err{color:#FF8A8F}
.console .sys{color:#6D8098;font-style:italic}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:10px;font-family:var(--mono)}
.led{width:8px;height:8px;border-radius:99px;background:var(--dim);flex:none}
.led.busy{background:var(--accent);animation:pulse 1s infinite}
.led.ready{background:var(--ok)}
.led.fail{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}

/* examples */
.ex{margin:18px 0}
.ex-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.ex-n{
  flex:none;width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;
}
.ex-h h4{font-size:16.5px;font-family:var(--display);margin-bottom:3px}
.ex-h p{margin:0;font-size:14px;color:var(--dim)}

/* quiz */
.q{border-bottom:1px solid var(--border);padding:20px 0}
.q:last-of-type{border-bottom:none}
.q-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.q-n{
  flex:none;width:25px;height:25px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--dim);
}
.q-t{font-weight:600;font-size:15px;margin:0}
.q .term{margin:0 0 13px}
.opts{display:grid;gap:8px}
.opt{
  display:flex;align-items:center;gap:11px;padding:10px 13px;border:1.5px solid var(--border);
  border-radius:10px;background:var(--surface);transition:.14s;text-align:start;width:100%;font-size:14px;
}
.opt:hover:not(.locked){border-color:var(--brand);background:var(--brand-soft)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.locked{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt-k{
  flex:none;width:23px;height:23px;border-radius:6px;border:1.5px solid var(--border);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim);background:var(--surface);
}
.opt.sel .opt-k,.opt.right .opt-k{border-color:currentColor}
.opt.right .opt-k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong .opt-k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt-v{font-family:var(--mono);font-size:13.4px;direction:ltr;text-align:start}
.opt-v.txt{font-family:inherit;font-size:14px;direction:inherit}
.exp{
  margin-top:12px;padding:12px 15px;border-radius:10px;background:var(--surface-2);
  border-inline-start:3px solid var(--brand);font-size:13.8px;
}
.exp b{color:var(--brand)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 22px;
  border-radius:11px;font-weight:650;font-size:14.5px;transition:.16s;border:1.5px solid transparent;
}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-a{background:var(--accent);color:#3D2F00}
.btn-a:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-g{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-g:hover{border-color:var(--brand);color:var(--brand)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-top:22px}

/* score banner */
.score{
  display:flex;align-items:center;gap:20px;padding:20px 22px;border-radius:var(--r);
  background:var(--surface-2);border:1px solid var(--border);flex-wrap:wrap;
}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg);width:84px;height:84px}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--border)}
.ring .fg{stroke:var(--brand);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:19px;font-weight:700}
.score-txt h3{font-size:19px;margin-bottom:3px}
.score-txt p{margin:0;color:var(--dim);font-size:14px}

/* home hero */
.hero{padding:34px 0 6px}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:700;line-height:1.05;margin:16px 0 14px}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
.hero h1 em::after{content:'';position:absolute;inset-inline:0;bottom:.06em;height:.28em;background:var(--accent);opacity:.42;z-index:-1;border-radius:3px}
.hero p.lede{font-size:17px;color:var(--dim);max-width:60ch;margin:0 0 26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:30px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px}
.stat b{display:block;font-family:var(--mono);font-size:25px;font-weight:700;color:var(--brand);line-height:1.1}
.stat span{font-size:12.5px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcard{display:flex;gap:14px;align-items:center;padding:16px 18px}
.tavatar{
  width:46px;height:46px;border-radius:13px;background:linear-gradient(140deg,var(--brand),var(--accent));
  display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:17px;flex:none;
}
.tcard b{display:block;font-size:15px;font-family:var(--display)}
.tcard span{font-size:12.5px;color:var(--dim)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:11px;margin-top:14px}
.mapitem{
  display:flex;gap:11px;align-items:center;padding:13px 15px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;text-align:start;transition:.16s;
}
.mapitem:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.mapitem b{font-size:13.6px;font-weight:600;display:block;line-height:1.3}
.mapitem span{font-size:11.5px;color:var(--dim)}

/* report */
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{
  text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  padding:9px 10px;border-bottom:1.5px solid var(--border);font-weight:700;
}
html[lang="fa"] .rt th{letter-spacing:0}
.rt td{padding:10px;border-bottom:1px solid var(--border)}
.rt tr:last-child td{border-bottom:none}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.tag{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;
  font-family:var(--mono);
}
html[lang="fa"] .tag{font-family:var(--body)}
.tag.a{background:var(--ok-soft);color:var(--ok)}
.tag.b{background:var(--brand-soft);color:var(--brand)}
.tag.c{background:#FFF4D1;color:#8A6A00}
html[data-theme="dark"] .tag.c{background:#2E2500;color:var(--accent)}
.tag.d{background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;max-width:340px}
.field label{font-size:12px;font-weight:600;color:var(--dim)}
.field input{
  height:42px;padding:0 13px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface);outline:none;transition:.15s;
}
.field input:focus{border-color:var(--brand)}
.empty{text-align:center;padding:52px 20px;color:var(--dim)}
.empty svg{width:52px;height:52px;opacity:.4;margin-bottom:12px}

/* toast */
.toast{
  position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translate(-50%,90px);
  background:var(--text);color:var(--surface);padding:11px 20px;border-radius:11px;font-size:13.5px;
  font-weight:600;z-index:99;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);
}
html[dir="rtl"] .toast{transform:translate(50%,90px)}
.toast.show{transform:translate(-50%,0)}
html[dir="rtl"] .toast.show{transform:translate(50%,0)}

/* scrim */
.scrim{display:none;position:fixed;inset:0;background:rgba(6,12,20,.5);z-index:55;backdrop-filter:blur(2px)}
.scrim.show{display:block}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:fixed;z-index:58;inset-block:62px 0;inset-inline-start:0;width:284px;
    transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);
  }
  html[dir="rtl"] .rail{transform:translateX(105%)}
  .rail.open{transform:translateX(0)!important}
  .menu-btn{display:inline-flex}
  .grid2{grid-template-columns:1fr}
  .wrap{padding:20px 15px}
  .brandtxt span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{
  .top,.rail,.tabs,.row,.noprint{display:none!important}
  body{background:#fff}
  .shell{grid-template-columns:1fr}
  .card{box-shadow:none;border-color:#bbb}
}
</style>
</head>
<body>

<script>
const LESSONS = [
/* ================= 1. PRINT ================= */
{
id:'print',
t:{en:'Printing with print()',fa:'چاپ با ()print'},
sub:{en:'Your first line of Python: putting words, numbers and emojis on the screen with commas and plus signs.',fa:'اولین خط پایتون شما: نمایش کلمه، عدد و ایموجی روی صفحه با کاما و علامت جمع.'},
theory:[
 {h:{en:'The print() function',fa:'تابع ()print'},
  p:{en:'print() sends whatever you put inside the parentheses to the screen. Text must be wrapped in quotes — single or double, your choice — and Python calls that text a <i>string</i>.',fa:'تابع ()print هر چیزی را که داخل پرانتز بگذارید روی صفحه نمایش می‌دهد. متن باید داخل کوتیشن باشد — تکی یا دوتایی، فرقی ندارد — و پایتون به آن متن <i>رشته</i> (string) می‌گوید.'},
  code:`print("Hello, world!")\nprint('Python is fun')`, out:`Hello, world!\nPython is fun`},
 {h:{en:'Comma = space between the pieces',fa:'کاما = یک فاصله بین قطعه‌ها'},
  p:{en:'A comma lets you print several values at once. Python glues them together and drops a single space between each one — and it does not care whether they are text or numbers.',fa:'با کاما می‌توانید چند مقدار را با هم چاپ کنید. پایتون آن‌ها را کنار هم می‌چیند و بین هرکدام یک فاصله می‌گذارد — و برایش مهم نیست متن باشند یا عدد.'},
  code:`print("Score:", 95, "points")\nprint("A", "B", "C")`, out:`Score: 95 points\nA B C`},
 {h:{en:'Plus = glue with no gap',fa:'جمع = چسباندن بدون فاصله'},
  p:{en:'The + operator joins strings with nothing in between, so you add spaces yourself. Important rule: + only works between two strings. Mixing text and a number with + raises a TypeError.',fa:'عملگر + رشته‌ها را بدون هیچ فاصله‌ای به هم می‌چسباند، پس فاصله را خودتان باید بگذارید. قانون مهم: + فقط بین دو رشته کار می‌کند. ترکیب متن و عدد با + خطای TypeError می‌دهد.'},
  code:`print("Py" + "thon")\nprint("Hello" + " " + "class")\n# print("Age: " + 15)  <-- TypeError!`, out:`Python\nHello class`},
 {h:{en:'sep and end',fa:'sep و end'},
  p:{en:'Two extras worth knowing: sep changes the separator used by commas, and end changes what is printed at the very end instead of a new line.',fa:'دو امکان مفید: sep جداکننده‌ی کاما را عوض می‌کند و end تعیین می‌کند در پایان چه چیزی چاپ شود، به‌جای رفتن به خط بعد.'},
  code:`print("2026","08","13", sep="/")\nprint("Loading", end="...")\nprint("done")`, out:`2026/08/13\nLoading...done`}
],
ex:[
 {t:{en:'Game over screen',fa:'صفحه‌ی پایان بازی'},
  p:{en:'Print a three-line game-over banner for a video game.',fa:'یک بنر سه‌خطی «پایان بازی» برای یک بازی ویدیویی چاپ کنید.'},
  code:`print("=" * 26)\nprint("   GAME OVER  💀")\nprint("=" * 26)\nprint("Final score:", 4820, "pts")`,
  out:`==========================\n   GAME OVER  💀\n==========================\nFinal score: 4820 pts`},
 {t:{en:'Pizza order slip',fa:'رسید سفارش پیتزا'},
  p:{en:'Print an order slip. Use + where you want no gap and , where you want one.',fa:'یک رسید سفارش چاپ کنید. هرجا فاصله نمی‌خواهید از + و هرجا می‌خواهید از , استفاده کنید.'},
  code:`print("🍕 " + "Pepperoni" + " Pizza")\nprint("Size:", "Large", "| Slices:", 8)\nprint("Total:", 245000, "Rials")`,
  out:`🍕 Pepperoni Pizza\nSize: Large | Slices: 8\nTotal: 245000 Rials`},
 {t:{en:'ASCII cat',fa:'گربه‌ی اَسکی'},
  p:{en:'Draw a cat with four print() calls. Notice the backslash needs care inside quotes.',fa:'با چهار دستور print یک گربه بکشید. دقت کنید که بک‌اسلش داخل کوتیشن نیاز به دقت دارد.'},
  code:`print(" /\\\\_/\\\\ ")\nprint("( o.o )")\nprint(" > ^ < ")\nprint("meow!", end=" 🐱")`,
  out:` /\\_/\\ \n( o.o )\n > ^ < \nmeow! 🐱`}
],
quiz:[
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print("Hi", "there")`,o:['Hithere','Hi there','Hi,there','Hi  there'],a:1,
  e:{en:'A comma always inserts exactly one space between the values.',fa:'کاما همیشه دقیقاً یک فاصله بین مقادیر قرار می‌دهد.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print("Hi" + "there")`,o:['Hi there','Hithere','Hi+there','Error'],a:1,
  e:{en:'+ joins strings with nothing between them, so you get Hithere.',fa:'عملگر + رشته‌ها را بدون هیچ چیزی به هم می‌چسباند، پس Hithere چاپ می‌شود.'}},
 {q:{en:'Which line causes an error?',fa:'کدام خط خطا می‌دهد؟'},o:['print("Age:", 15)','print("Age: " + "15")','print("Age: " + 15)','print(15)'],a:2,
  e:{en:'You cannot join a string and a number with +. Use a comma, or convert with str(15).',fa:'نمی‌توان رشته و عدد را با + به هم چسباند. از کاما استفاده کنید یا با (15)str تبدیل کنید.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print("A","B",sep="-")`,o:['A B','A-B','AB','A - B'],a:1,
  e:{en:'sep replaces the default single space with whatever you give it.',fa:'پارامتر sep به‌جای فاصله‌ی پیش‌فرض، هر چیزی که بدهید را قرار می‌دهد.'}},
 {q:{en:'How many lines does this produce?',fa:'این کد چند خط خروجی می‌دهد؟'},code:`print("one", end=" ")\nprint("two")`,o:['0','1','2','3'],a:1,
  e:{en:'end=" " replaces the newline with a space, so both words land on the same line.',fa:'با " "=end به‌جای رفتن به خط بعد یک فاصله چاپ می‌شود، پس هر دو کلمه در یک خط می‌آیند.'}},
 {q:{en:'Which is a valid print statement?',fa:'کدام دستور print معتبر است؟'},o:['print(Hello)','Print("Hello")','print("Hello")','print["Hello"]'],a:2,
  e:{en:'Python is case-sensitive: lowercase print, round parentheses, quotes around text.',fa:'پایتون به بزرگی و کوچکی حروف حساس است: print با حرف کوچک، پرانتز گِرد و کوتیشن دور متن.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print("ha" * 3)`,o:['hahaha','ha ha ha','ha*3','Error'],a:0,
  e:{en:'A string times an integer repeats it — a handy trick for drawing lines and banners.',fa:'رشته ضرب در عدد صحیح یعنی تکرار آن — ترفندی مفید برای کشیدن خط و بنر.'}},
 {q:{en:'What is printed?',fa:'چه چیزی چاپ می‌شود؟'},code:`print()`,o:[{en:'Nothing at all',fa:'اصلاً هیچ چیز'},{en:'An empty line',fa:'یک خط خالی'},{en:'An error',fa:'یک خطا'},{en:'The word None',fa:'کلمه‌ی None'}],a:1,
  e:{en:'An empty print() still moves to the next line, which is how you add blank spacing.',fa:'دستور ()print خالی همچنان به خط بعد می‌رود؛ از این برای ایجاد فاصله‌ی خالی استفاده می‌شود.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print(3 + 4)\nprint("3 + 4")`,o:['7 then 7','3 + 4 then 7','7 then 3 + 4','34 then 7'],a:2,
  e:{en:'Without quotes Python calculates; inside quotes it is just text.',fa:'بدون کوتیشن پایتون محاسبه می‌کند؛ داخل کوتیشن فقط یک متن است.'}},
 {q:{en:'Which line adds a comment that Python ignores?',fa:'کدام خط یک توضیح (کامنت) است که پایتون نادیده می‌گیرد؟'},o:['// my note','<!-- my note -->','# my note','/* my note */'],a:2,
  e:{en:'In Python, # starts a comment that runs to the end of the line.',fa:'در پایتون، علامت # یک کامنت را شروع می‌کند که تا انتهای خط ادامه دارد.'}}
]},

/* ================= 2. VARIABLES ================= */
{
id:'vars',
t:{en:'Variables',fa:'متغیرها'},
sub:{en:'Labelled boxes that hold your data — naming them well is half of good programming.',fa:'جعبه‌های برچسب‌دار که داده‌های شما را نگه می‌دارند — نام‌گذاری خوب، نیمی از برنامه‌نویسی خوب است.'},
theory:[
 {h:{en:'Making a variable',fa:'ساختن یک متغیر'},
  p:{en:'A variable is a name pointing to a value. Use a single = to store: name on the left, value on the right. Nothing is printed unless you ask.',fa:'متغیر یک نام است که به یک مقدار اشاره می‌کند. برای ذخیره از یک = استفاده کنید: نام در سمت چپ، مقدار در سمت راست. تا زمانی که چاپ نکنید چیزی نمایش داده نمی‌شود.'},
  code:`player = "Sara"\nlevel = 7\nprint(player, "is on level", level)`, out:`Sara is on level 7`},
 {h:{en:'Naming rules',fa:'قوانین نام‌گذاری'},
  p:{en:'Names may contain letters, digits and underscores, but must not start with a digit and must not be a Python keyword. Names are case-sensitive: score and Score are two different boxes.',fa:'نام‌ها می‌توانند شامل حرف، رقم و زیرخط باشند، اما نباید با رقم شروع شوند و نباید کلمه‌ی کلیدی پایتون باشند. نام‌ها به بزرگی و کوچکی حروف حساس‌اند: score و Score دو جعبه‌ی متفاوت‌اند.'},
  code:`high_score = 100   # good\nscore2 = 50        # fine\n# 2score = 10      # ✗ starts with a digit\n# class = "A"      # ✗ reserved keyword`, out:``},
 {h:{en:'Variables change',fa:'متغیرها تغییر می‌کنند'},
  p:{en:'Assigning again replaces the old value. The right side is calculated first, so a line like coins = coins + 5 makes perfect sense.',fa:'انتساب دوباره، مقدار قبلی را جایگزین می‌کند. سمت راست اول محاسبه می‌شود، پس خطی مثل coins = coins + 5 کاملاً منطقی است.'},
  code:`coins = 10\ncoins = coins + 5\ncoins += 3        # short form\nprint(coins)`, out:`18`},
 {h:{en:'Swapping and multiple assignment',fa:'جابه‌جایی و انتساب چندگانه'},
  p:{en:'Python can assign several variables in one line, and swap two values without a temporary box — something most other languages cannot do.',fa:'پایتون می‌تواند چند متغیر را در یک خط مقداردهی کند و دو مقدار را بدون جعبه‌ی کمکی جابه‌جا کند — کاری که بیشتر زبان‌های دیگر نمی‌توانند.'},
  code:`a, b = 3, 9\na, b = b, a\nprint(a, b)`, out:`9 3`}
],
ex:[
 {t:{en:'Player profile card',fa:'کارت مشخصات بازیکن'},
  p:{en:'Store a game character in variables and print a tidy profile.',fa:'مشخصات یک شخصیت بازی را در متغیرها ذخیره کنید و یک پروفایل مرتب چاپ کنید.'},
  code:`name = "Kian"\nclass_ = "Archer"\nhp = 120\ngold = 45\n\nprint("🏹 PLAYER PROFILE")\nprint("Name  :", name)\nprint("Class :", class_)\nprint("HP    :", hp, "| Gold:", gold)`,
  out:`🏹 PLAYER PROFILE\nName  : Kian\nClass : Archer\nHP    : 120 | Gold: 45`},
 {t:{en:'Health after a battle',fa:'جان بعد از نبرد'},
  p:{en:'Start with 100 HP, take two hits, drink a potion, then report the result.',fa:'با ۱۰۰ جان شروع کنید، دو ضربه بخورید، یک معجون بنوشید و نتیجه را گزارش دهید.'},
  code:`hp = 100\nhp -= 35      # dragon hit\nhp -= 20      # trap\nhp += 40      # potion\nprint("HP left:", hp)`,
  out:`HP left: 85`},
 {t:{en:'Swap two songs',fa:'جابه‌جایی دو آهنگ'},
  p:{en:'Two tracks are in the wrong order in a playlist. Swap them in one line.',fa:'دو آهنگ در لیست پخش جابه‌جا هستند. آن‌ها را در یک خط عوض کنید.'},
  code:`track1 = "Bohemian Rhapsody"\ntrack2 = "Imagine"\nprint("Before:", track1, "|", track2)\ntrack1, track2 = track2, track1\nprint("After :", track1, "|", track2)`,
  out:`Before: Bohemian Rhapsody | Imagine\nAfter : Imagine | Bohemian Rhapsody`}
],
quiz:[
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`x = 5\nx = 8\nprint(x)`,o:['5','8','13','58'],a:1,
  e:{en:'The second assignment overwrites the first; a variable holds only its newest value.',fa:'انتساب دوم، اولی را بازنویسی می‌کند؛ متغیر فقط جدیدترین مقدار را نگه می‌دارد.'}},
 {q:{en:'Which variable name is invalid?',fa:'کدام نام متغیر نامعتبر است؟'},o:['my_score','_total','2nd_place','levelTwo'],a:2,
  e:{en:'A name can never start with a digit.',fa:'نام متغیر هرگز نمی‌تواند با رقم شروع شود.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`n = 4\nn += 6\nn -= 2\nprint(n)`,o:['4','8','10','12'],a:1,
  e:{en:'4 + 6 = 10, then 10 − 2 = 8.',fa:'۴ + ۶ = ۱۰، سپس ۱۰ − ۲ = ۸.'}},
 {q:{en:'Are Score and score the same variable?',fa:'آیا Score و score یک متغیرند؟'},o:[{en:'Yes, always',fa:'بله، همیشه'},{en:'No, Python is case-sensitive',fa:'خیر، پایتون به بزرگی/کوچکی حروف حساس است'},{en:'Only inside a loop',fa:'فقط داخل حلقه'},{en:'Only for numbers',fa:'فقط برای اعداد'}],a:1,
  e:{en:'Uppercase and lowercase letters make completely different names.',fa:'حروف بزرگ و کوچک، نام‌های کاملاً متفاوتی می‌سازند.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`a, b = 1, 2\na, b = b, a\nprint(a, b)`,o:['1 2','2 1','2 2','1 1'],a:1,
  e:{en:'The right side is evaluated first, so the two values trade places.',fa:'سمت راست ابتدا محاسبه می‌شود، پس دو مقدار جای خود را عوض می‌کنند.'}},
 {q:{en:'What is the value of total?',fa:'مقدار total چند است؟'},code:`price = 20\ncount = 3\ntotal = price * count`,o:['20','3','60','203'],a:2,
  e:{en:'The right side is calculated first and only the result, 60, is stored.',fa:'ابتدا سمت راست محاسبه می‌شود و فقط نتیجه، یعنی ۶۰، ذخیره می‌گردد.'}},
 {q:{en:'Which one is a keyword you cannot use as a variable name?',fa:'کدام‌یک کلمه‌ی کلیدی است و نمی‌توان به‌عنوان نام متغیر استفاده کرد؟'},o:['total','if','value','number'],a:1,
  e:{en:'if is reserved by the language itself.',fa:'کلمه‌ی if توسط خودِ زبان رزرو شده است.'}},
 {q:{en:'What happens here?',fa:'اینجا چه اتفاقی می‌افتد؟'},code:`print(age)\nage = 15`,o:[{en:'Prints 15',fa:'۱۵ چاپ می‌شود'},{en:'Prints nothing',fa:'چیزی چاپ نمی‌شود'},{en:'NameError — used before it exists',fa:'خطای NameError — قبل از ساخته‌شدن استفاده شده'},{en:'Prints 0',fa:'۰ چاپ می‌شود'}],a:2,
  e:{en:'Python runs top to bottom, so the variable must be created before it is used.',fa:'پایتون از بالا به پایین اجرا می‌کند، پس متغیر باید قبل از استفاده ساخته شود.'}},
 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`word = "go"\nword = word * 2\nprint(word)`,o:['go','gogo','go go','4'],a:1,
  e:{en:'Multiplying a string repeats it, and the result is stored back in the same name.',fa:'ضرب رشته آن را تکرار می‌کند و نتیجه دوباره در همان نام ذخیره می‌شود.'}},
 {q:{en:'Which line stores the number 10 in a variable called lives?',fa:'کدام خط عدد ۱۰ را در متغیری به نام lives ذخیره می‌کند؟'},o:['lives == 10','10 = lives','lives = 10','lives := "10"'],a:2,
  e:{en:'A single = stores; a double == compares.',fa:'یک = ذخیره می‌کند؛ دو تا == مقایسه می‌کند.'}}
]},

/* ================= 3. TYPES ================= */
{
id:'types',
t:{en:'Text and numbers: str, int, float',fa:'متن و عدد: str و int و float'},
sub:{en:'Why "5" and 5 behave completely differently, and how type() tells you what you are holding.',fa:'چرا "5" و 5 کاملاً متفاوت رفتار می‌کنند و چطور ()type به شما می‌گوید چه چیزی در دست دارید.'},
theory:[
 {h:{en:'The three types you will use most',fa:'سه نوع داده‌ای که بیشتر استفاده می‌کنید'},
  p:{en:'str is text in quotes, int is a whole number, float is a number with a decimal point. bool (True/False) joins them soon.',fa:'نوع str متنِ داخل کوتیشن است، int عدد صحیح و float عدد اعشاری. نوع bool با مقادیر True/False هم به‌زودی اضافه می‌شود.'},
  code:`name = "Ali"      # str\nage  = 15         # int\nrate = 4.75       # float\ncool = True       # bool`, out:``},
 {h:{en:'Ask Python with type()',fa:'با ()type از پایتون بپرسید'},
  p:{en:'type() reports the type of any value. This one function saves hours of confusion when a program misbehaves.',fa:'تابع ()type نوع هر مقداری را می‌گوید. همین یک تابع، ساعت‌ها سردرگمی را هنگام بدرفتاری برنامه از بین می‌برد.'},
  code:`print(type("15"))\nprint(type(15))\nprint(type(15.0))`, out:`<class 'str'>\n<class 'int'>\n<class 'float'>`},
 {h:{en:'Same symbol, different meaning',fa:'یک علامت، دو معنی'},
  p:{en:'The operators + and * change behaviour depending on the type. With numbers they calculate; with strings they join and repeat.',fa:'عملگرهای + و * بسته به نوع داده رفتار متفاوتی دارند. با عدد محاسبه می‌کنند؛ با رشته می‌چسبانند و تکرار می‌کنند.'},
  code:`print(3 + 4)\nprint("3" + "4")\nprint(3 * 4)\nprint("3" * 4)`, out:`7\n34\n12\n3333`},
 {h:{en:'Float surprises',fa:'شگفتی‌های اعشار'},
  p:{en:'Dividing with / always gives a float, even 10 / 2. And because computers store decimals in binary, 0.1 + 0.2 is famously not exactly 0.3.',fa:'تقسیم با / همیشه عدد اعشاری می‌دهد، حتی 10 / 2. و چون کامپیوتر اعشار را دودویی ذخیره می‌کند، حاصل 0.1 + 0.2 مشهورترین نمونه‌ی «دقیقاً ۰٫۳ نیست» است.'},
  code:`print(10 / 2)\nprint(0.1 + 0.2)\nprint(round(0.1 + 0.2, 2))`, out:`5.0\n0.30000000000000004\n0.3`}

 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print("7" + "7")`,o:['14','77','7 7','Error'],a:1,

 {q:{en:'What does type(True) show?',fa:'خروجی (type(True چیست؟'},o:["<class 'int'>","<class 'bool'>","<class 'str'>","<class 'true'>"],a:1,
  e:{en:'True and False are bool values (though internally they behave like 1 and 0).',fa:'مقادیر True و False از نوع bool هستند (هرچند در باطن مثل ۱ و ۰ رفتار می‌کنند).'}},
 {q:{en:'Which value is a string?',fa:'کدام مقدار رشته است؟'},o:['15','15.0','"15"','True'],a:2,

 {q:{en:'Which line raises TypeError?',fa:'کدام خط خطای TypeError می‌دهد؟'},o:['"a" * 3','3 * 3','"a" + "3"','"a" + 3'],a:3,

 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print(type(5) == type(5.0))`,o:['True','False','5','Error'],a:1,

id:'convert',

theory:[
 {h:{en:'Text to number',fa:'از متن به عدد'},
  p:{en:'int("25") produces the number 25 so you can do arithmetic with it. float("3.5") does the same for decimals.',fa:'دستور ("25")int عدد ۲۵ را می‌سازد تا بتوانید با آن محاسبه کنید. تابع ("3.5")float همین کار را برای اعشار انجام می‌دهد.'},

  p:{en:'str(7) produces "7", which is exactly what you need when joining with + inside a sentence.',fa:'دستور (7)str مقدار "7" را می‌سازد؛ دقیقاً همان چیزی که برای چسباندن با + داخل یک جمله لازم دارید.'},
  code:`score = 88\nprint("Score: " + str(score) + " / 100")`, out:`Score: 88 / 100`},

  code:`print(int(3.9))        # 3, not 4\nprint(int(float("3.9")))\n# print(int("3.9"))    # ✗ ValueError`, out:`3\n3`},
 {h:{en:'f-strings: the modern way',fa:'رشته‌های f: روش مدرن'},
  p:{en:'Put an f before the quotes and you can drop variables straight into the text with braces — no str() needed anywhere.',fa:'یک f قبل از کوتیشن بگذارید تا بتوانید متغیرها را با آکولاد مستقیم داخل متن قرار دهید — بدون نیاز به ()str.'},
  code:`name = "Reza"\nage = 16\nprint(f"{name} is {age} years old")\nprint(f"Next year: {age + 1}")`, out:`Reza is 16 years old\nNext year: 17`}

ex:[
 {t:{en:'Age in dog years',fa:'سن به سالِ سگی'},

  code:`age_text = "14"\nage = int(age_text)\ndog = age * 7\nprint("Human: " + str(age) + " years")\nprint("Dog   : " + str(dog) + " years 🐶")`,

 {t:{en:'Grade average with f-strings',fa:'معدل با رشته‌های f'},
  p:{en:'Three grades come in as text. Average them and show one decimal place.',fa:'سه نمره به‌صورت متن می‌آیند. میانگین بگیرید و با یک رقم اعشار نمایش دهید.'},
  code:`g1, g2, g3 = "18", "15", "20"\navg = (int(g1) + int(g2) + int(g3)) / 3\nprint(f"Grades: {g1}, {g2}, {g3}")\nprint(f"Average: {avg:.1f} / 20")`,
  out:`Grades: 18, 15, 20\nAverage: 17.7 / 20`},
 {t:{en:'Digit sum of a number',fa:'مجموع رقم‌های یک عدد'},

  code:`number = 4821\ntotal = 0\nfor digit in str(number):\n    total += int(digit)\nprint(f"Digits of {number} add up to {total}")`,
  out:`Digits of 4821 add up to 15`}
],

 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`n = 5\nprint(f"n is {n * 2}")`,o:['n is 10','n is 5*2','n is {n*2}','10'],a:0,

 {q:{en:'What is the type of str(99)?',fa:'نوع (str(99 چیست؟'},o:['int','float','str','bool'],a:2,

 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print(float("10") / 4)`,o:['2.5','2','2.5.0','Error'],a:0,

 {q:{en:'Which is the cleanest way to print a name and score together?',fa:'تمیزترین راه برای چاپ همزمان نام و نمره کدام است؟'},o:['print("Name: " + name + " Score: " + str(sc))','print(f"Name: {name} Score: {sc}")','print("Name:" , name , "Score:" , sc)','print("Name: " + name + " Score: " + sc)'],a:1,

 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`print(int("3") * "ab")`,o:['ababab','ab3','3ab','Error'],a:0,

 {q:{en:'What does this print?',fa:'خروجی این کد چیست؟'},code:`x = "9"\nprint(x * 2)\nprint(int(x) * 2)`,o:['99 then 18','18 then 18','99 then 99','18 then 99'],a:0,

/* ================= 9. WHILE ================= */
{
id:'while',
t:{en:'The while loop',fa:'حلقه‌ی while'},
sub:{en:'Repeat as long as something stays true — perfect when you do not know how many rounds you need.',fa:'تکرار تا زمانی که یک شرط برقرار است — عالی برای وقتی نمی‌دانید چند دور لازم است.'},
theory:[
 {h:{en:'How while works',fa:'while چطور کار می‌کند'},
  p:{en:'Python checks the condition, runs the block if it is True, then checks again. Three parts are essential: a starting value, a condition, and something inside that moves toward the end.',fa:'پایتون شرط را بررسی می‌کند، اگر درست بود بلوک را اجرا می‌کند و دوباره بررسی می‌کند. سه بخش ضروری است: مقدار اولیه، شرط، و چیزی داخل حلقه که به‌سمت پایان حرکت کند.'},
  code:`count = 3\nwhile count > 0:\n    print(count, "...")\n    count -= 1\nprint("Lift off! 🚀")`, out:`3 ...\n2 ...\n1 ...\nLift off! 🚀`},
 {h:{en:'The infinite loop trap',fa:'تله‌ی حلقه‌ی بی‌نهایت'},
  p:{en:'If nothing inside the loop changes the condition, it never ends. Forgetting the counter update is the classic beginner bug.',fa:'اگر چیزی داخل حلقه شرط را تغییر ندهد، حلقه هرگز تمام نمی‌شود. فراموش‌کردن به‌روزرسانی شمارنده، باگ کلاسیک مبتدیان است.'},
  code:`# ✗ never stops:\n# n = 5\n# while n > 0:\n#     print(n)\n\n# ✓ fixed:\nn = 5\nwhile n > 0:\n    print(n, end=" ")\n    n -= 1`, out:`5 4 3 2 1 `},
 {h:{en:'while vs for',fa:'مقایسه‌ی while و for'},
  p:{en:'Use for when the number of rounds is known in advance, and while when it depends on what happens — a password attempt, a game that runs until you lose.',fa:'وقتی تعداد دورها از قبل مشخص است از for و وقتی به اتفاقات بستگی دارد از while استفاده کنید — مثل تلاش برای رمز عبور یا بازی‌ای که تا باختن ادامه دارد.'},
  code:`# known count -> for\nfor i in range(3):\n    print("for", i)\n\n# unknown count -> while\nhp = 30\nwhile hp > 0:\n    hp -= 12\n    print("hp:", hp)`, out:`for 0\nfor 1\nfor 2\nhp: 18\nhp: 6\nhp: -6`},
 {h:{en:'Accumulating inside while',fa:'انباشتن داخل while'},
  p:{en:'A running total plus a condition is enough to answer questions like: how many days until my savings reach the target?',fa:'یک جمع تجمعی به‌همراه یک شرط کافی است تا به سؤال‌هایی مثل «چند روز تا رسیدن پس‌اندازم به هدف؟» پاسخ دهید.'},
  code:`saved = 0\ndays = 0\nwhile saved < 100:\n    saved += 30\n    days += 1\nprint(f"{days} days, total {saved}")`, out:`4 days, total 120`}
],
ex:[

  code:`secret = 37\nlow, high = 1, 100\ntries = 0\nwhile True:\n    guess = (low + high) // 2\n    tries += 1\n    print(f"Try {tries}: is it {guess}?")\n    if guess == secret:\n        print("Found it! 🎯")\n        break\n    elif guess < secret:\n        low = guess + 1\n    else:\n        high = guess - 1`,

  code:`n = 27\nsteps = 0\nwhile n != 1:\n    if n % 2 == 0:\n        n = n // 2\n    else:\n        n = 3 * n + 1\n    steps += 1\nprint(f"Reached 1 in {steps} steps")`,
  out:`Reached 1 in 111 steps`},
 {t:{en:'Password with 3 attempts',fa:'رمز عبور با ۳ تلاش'},
  p:{en:'A login screen that stops after three wrong tries.',fa:'صفحه‌ی ورود که بعد از سه تلاش اشتباه متوقف می‌شود.'},
  code:`real = "py2026"\ntries = 3\nattempts = ["hello", "python", "py2026"]\ni = 0\nwhile tries > 0:\n    guess = attempts[i]\n    i += 1\n    if guess == real:\n        print("Access granted ✅")\n        break\n    tries -= 1\n    print(f"Wrong. {tries} tries left")\nelse:\n    print("Account locked 🔒")`,

],

/* ================= 10. BREAK / CONTINUE ================= */
{
id:'ctrl',
t:{en:'break and continue',fa:'دستورهای break و continue'},
sub:{en:'Two words that let you jump out of a loop early or skip a single round.',fa:'دو کلمه که به شما اجازه می‌دهند زودتر از حلقه بیرون بپرید یا یک دور را رد کنید.'},
theory:[
 {h:{en:'break: leave the loop now',fa:'break: همین حالا از حلقه خارج شو'},
  p:{en:'break stops the whole loop immediately. Anything after it inside the loop is skipped, and execution continues below the loop.',fa:'دستور break کل حلقه را فوراً متوقف می‌کند. هرچه بعد از آن داخل حلقه باشد رد می‌شود و اجرا از پایین حلقه ادامه می‌یابد.'},
  code:`for i in range(1, 10):\n    if i == 4:\n        break\n    print(i, end=" ")\nprint("| stopped")`, out:`1 2 3 | stopped`},
 {h:{en:'continue: skip this round only',fa:'continue: فقط این دور را رد کن'},
  p:{en:'continue jumps back to the top of the loop for the next item. The loop itself keeps going.',fa:'دستور continue به بالای حلقه برمی‌گردد تا سراغ آیتم بعدی برود. خود حلقه ادامه پیدا می‌کند.'},
  code:`for i in range(1, 8):\n    if i % 2 == 0:\n        continue\n    print(i, end=" ")`, out:`1 3 5 7 `},
 {h:{en:'Searching with break',fa:'جست‌وجو با break'},
  p:{en:'When you are looking for one thing, break as soon as you find it — there is no reason to keep searching.',fa:'وقتی دنبال یک چیز می‌گردید، به‌محض یافتنش break کنید — دلیلی برای ادامه‌ی جست‌وجو نیست.'},
  code:`text = "programming"\nfor i in range(len(text)):\n    if text[i] == "g":\n        print("First g at index", i)\n        break`, out:`First g at index 3`},
 {h:{en:'The loop-else clause',fa:'بخش else حلقه'},
  p:{en:'A rarely taught gem: else attached to a loop runs only if the loop finished without hitting a break. Perfect for the was-it-found question.',fa:'یک نکته‌ی کمتر آموزش‌داده‌شده: بخش else متصل به حلقه فقط وقتی اجرا می‌شود که حلقه بدون برخورد به break تمام شده باشد. عالی برای پرسش «پیدا شد یا نه؟».'},
  code:`for n in [4, 6, 9, 10]:\n    if n % 5 == 0:\n        print("Found", n)\n        break\nelse:\n    print("No multiple of 5")`, out:`Found 10`}
],
ex:[
 {t:{en:'Find the first prime after 100',fa:'یافتن اولین عدد اول بعد از ۱۰۰'},
  p:{en:'Two loops, two breaks — a classic search pattern.',fa:'دو حلقه، دو break — یک الگوی کلاسیک جست‌وجو.'},
  code:`n = 101\nwhile True:\n    is_prime = True\n    for d in range(2, int(n ** 0.5) + 1):\n        if n % d == 0:\n            is_prime = False\n            break\n    if is_prime:\n        print("First prime after 100:", n)\n        break\n    n += 1`,
  out:`First prime after 100: 101`},
 {t:{en:'Skip the spam messages',fa:'رد کردن پیام‌های اسپم'},
  p:{en:'Print an inbox but continue past anything marked as spam.',fa:'صندوق ورودی را چاپ کنید اما با continue از پیام‌های اسپم بگذرید.'},
  code:`inbox = ["Homework due", "SPAM: win a car", "Party at 8", "SPAM: free coins"]\nshown = 0\nfor msg in inbox:\n    if msg.startswith("SPAM"):\n        continue\n    shown += 1\n    print(f"{shown}. {msg}")\nprint("Filtered", len(inbox) - shown, "spam messages 🗑️")`,
  out:`1. Homework due\n2. Party at 8\nFiltered 2 spam messages 🗑️`},
 {t:{en:'Vending machine',fa:'دستگاه فروش خودکار'},
  p:{en:'Keep taking coins until the price is met, then break out.',fa:'تا رسیدن به قیمت سکه بگیرید و بعد از حلقه خارج شوید.'},
  code:`price = 25\npaid = 0\ncoins = [5, 10, 5, 10, 5]\nfor c in coins:\n    paid += c\n    print(f"Inserted {c} -> paid {paid}")\n    if paid >= price:\n        print("Change:", paid - price, "🥤")\n        break`,
  out:`Inserted 5 -> paid 5\nInserted 10 -> paid 15\nInserted 5 -> paid 20\nInserted 10 -> paid 30\nChange: 5 🥤`}
],
quiz:[

/* ================= 11. NESTED LOOPS ================= */
{
id:'nested',
t:{en:'Nested loops (for inside for)',fa:'حلقه‌های تودرتو (for داخل for)'},
sub:{en:'A loop inside a loop: grids, tables, patterns and every pair you can imagine.',fa:'حلقه داخل حلقه: شبکه‌ها، جدول‌ها، الگوها و هر جفتی که تصور کنید.'},
theory:[
 {h:{en:'How nesting runs',fa:'اجرای تودرتو چگونه است'},
  p:{en:'The inner loop completes fully for every single round of the outer loop. Two loops of 3 and 4 rounds run the inner body 12 times.',fa:'حلقه‌ی داخلی برای هر دورِ حلقه‌ی بیرونی به‌طور کامل اجرا می‌شود. دو حلقه با ۳ و ۴ دور، بدنه‌ی داخلی را ۱۲ بار اجرا می‌کنند.'},
  code:`for row in range(2):\n    for col in range(3):\n        print(f"({row},{col})", end=" ")\n    print()`, out:`(0,0) (0,1) (0,2) \n(1,0) (1,1) (1,2) `},
 {h:{en:'Rows and columns',fa:'سطر و ستون'},
  p:{en:'Think of the outer loop as the row and the inner loop as the column. The print() with no arguments after the inner loop is what ends each row.',fa:'حلقه‌ی بیرونی را سطر و حلقه‌ی داخلی را ستون در نظر بگیرید. دستور ()print خالی بعد از حلقه‌ی داخلی است که هر سطر را تمام می‌کند.'},
  code:`for r in range(1, 4):\n    for c in range(1, 4):\n        print(r * c, end="\\t")\n    print()`, out:`1\t2\t3\t\n2\t4\t6\t\n3\t6\t9\t`},
 {h:{en:'Triangles: the inner range depends on the outer',fa:'مثلث‌ها: محدوده‌ی داخلی به بیرونی وابسته است'},
  p:{en:'When the inner range uses the outer variable, the shape becomes a triangle instead of a rectangle.',fa:'وقتی محدوده‌ی داخلی از متغیر بیرونی استفاده کند، شکل به‌جای مستطیل، مثلث می‌شود.'},
  code:`for i in range(1, 5):\n    for j in range(i):\n        print("★", end="")\n    print()`, out:`★\n★★\n★★★\n★★★★`},
 {h:{en:'Counting the work',fa:'شمردن حجم کار'},
  p:{en:'Nested loops multiply. Two nested loops over 1000 items each means a million rounds — worth remembering before you write one.',fa:'حلقه‌های تودرتو در هم ضرب می‌شوند. دو حلقه‌ی تودرتو روی ۱۰۰۰ آیتم یعنی یک میلیون دور — قبل از نوشتنشان به یاد داشته باشید.'},
  code:`count = 0\nfor i in range(4):\n    for j in range(5):\n        count += 1\nprint("Inner body ran", count, "times")`, out:`Inner body ran 20 times`}
],
ex:[

],

{
id:'mix',
t:{en:'Putting if together with for and while',fa:'ترکیب if با for و while'},
sub:{en:'The three tools you already know, combined — this is where real programs are born.',fa:'سه ابزاری که می‌شناسید، کنار هم — اینجاست که برنامه‌های واقعی متولد می‌شوند.'},
theory:[
 {h:{en:'Filtering inside a loop',fa:'فیلترکردن داخل حلقه'},
  p:{en:'An if inside a for lets you act on some items and ignore the rest. This single pattern covers a huge share of everyday programming.',fa:'یک if داخل for به شما اجازه می‌دهد روی برخی آیتم‌ها عمل کنید و بقیه را نادیده بگیرید. همین یک الگو بخش بزرگی از برنامه‌نویسی روزمره را پوشش می‌دهد.'},
  code:`for n in range(1, 11):\n    if n % 3 == 0:\n        print(n, "is a multiple of 3")`, out:`3 is a multiple of 3\n6 is a multiple of 3\n9 is a multiple of 3`},
 {h:{en:'Counting and summing with a condition',fa:'شمردن و جمع‌زدن با شرط'},
  p:{en:'Create the counter before the loop, update it inside the if, and read it after the loop ends. Order matters more than anything here.',fa:'شمارنده را قبل از حلقه بسازید، داخل if به‌روزش کنید و بعد از پایان حلقه بخوانیدش. اینجا ترتیب از هر چیزی مهم‌تر است.'},
  code:`marks = [18, 9, 14, 7, 20, 11]\npassed = 0\ntotal = 0\nfor m in marks:\n    total += m\n    if m >= 10:\n        passed += 1\nprint("Passed:", passed, "of", len(marks))\nprint("Average:", total / len(marks))`, out:`Passed: 4 of 6\nAverage: 13.166666666666666`},
 {h:{en:'if / elif inside a loop',fa:'if و elif داخل حلقه'},
  p:{en:'A full ladder inside a loop classifies every item as it goes past — one pass, three categories.',fa:'یک نردبان کامل داخل حلقه، هر آیتم را همان‌جا دسته‌بندی می‌کند — یک پیمایش، سه دسته.'},
  code:`for t in [-4, 0, 12, 31]:\n    if t < 0:\n        print(t, "❄️ freezing")\n    elif t < 20:\n        print(t, "🧥 cold")\n    else:\n        print(t, "☀️ warm")`, out:`-4 ❄️ freezing\n0 🧥 cold\n12 🧥 cold\n31 ☀️ warm`},
 {h:{en:'while + if: menu loops',fa:'while و if: حلقه‌ی منو'},
  p:{en:'A while loop that keeps running until a condition changes, with an if choosing what happens each round, is the skeleton of almost every game.',fa:'حلقه‌ی while که تا تغییر یک شرط ادامه دارد و یک if که هر دور تصمیم می‌گیرد چه شود، اسکلت تقریباً هر بازی است.'},
  code:`hp = 40\nturn = 0\nwhile hp > 0:\n    turn += 1\n    if turn % 2 == 0:\n        hp -= 15\n        print(f"Turn {turn}: big hit, hp = {hp}")\n    else:\n        hp -= 5\n        print(f"Turn {turn}: small hit, hp = {hp}")\nprint("Defeated in", turn, "turns")`, out:`Turn 1: small hit, hp = 35\nTurn 2: big hit, hp = 20\nTurn 3: small hit, hp = 15\nTurn 4: big hit, hp = 0\nDefeated in 4 turns`}
],

 {t:{en:'Count vowels in a sentence',fa:'شمردن مصوت‌ها در یک جمله'},
  p:{en:'Loop over the characters and use in to test membership.',fa:'روی کاراکترها حلقه بزنید و با in عضویت را بررسی کنید.'},

],

/* ==================== SYNTAX HIGHLIGHT ==================== */
const KW = ['False','None','True','and','as','break','class','continue','def','elif','else','except','finally','for','from','global','if','import','in','is','lambda','not','or','pass','raise','return','try','while','with','yield'];
const BI = ['print','input','int','str','float','bool','len','range','sum','min','max','abs','round','sorted','type','list','enumerate','append','insert','remove','pop','sort','reverse','count','index','extend','clear','copy','lower','upper','strip','split','join','startswith','isalpha','choice','sqrt','floor','ceil','pow','random','math'];
function hl(src){
  let s = esc(src);
  s = s.replace(/(#[^\n]*)/g, '<span class="c">$1</span>');
  s = s.replace(/('[^'\n]*'|"[^"\n]*")/g, '<span class="s">$1</span>');
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="n">$1</span>');
  s = s.replace(new RegExp('\\b(' + KW.join('|') + ')\\b','g'), '<span class="k">$1</span>');
  s = s.replace(new RegExp('\\b(' + BI.join('|') + ')\\b','g'), '<span class="b">$1</span>');
  return s;
}

/* ==================== PYTHON ENGINE ==================== */
let py = null, pyState = 'idle', outTarget = null;
window.__pyPrompt = p => { const v = window.prompt(String(p) || 'input()'); return v === null ? '' : v; };
const PRELUDE = `
import builtins, js
def __in(prompt=""):
    print(prompt, end="")
    v = js.__pyPrompt(str(prompt))
    print(v)
    return v
builtins.input = __in
`;
function writeOut(txt, cls){
  if(!outTarget) return;
  const pre = outTarget.querySelector('pre');
  const span = document.createElement('span');
  if(cls) span.className = cls;
  span.textContent = txt;
  pre.appendChild(span);
  outTarget.scrollTop = outTarget.scrollHeight;
}
async function bootPy(led, lbl){
  if(py) return py;
  if(pyState === 'boot'){ while(pyState === 'boot') await new Promise(r => setTimeout(r,180)); return py; }
  pyState = 'boot';
  led.className = 'led busy'; lbl.textContent = T('loading');
  try{
    if(!window.loadPyodide){
      await new Promise((res, rej) => {
        const sc = document.createElement('script');
        sc.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
        sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
      });
    }
    py = await window.loadPyodide({ indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    py.setStdout({ batched: s => writeOut(s + '\n') });
    py.setStderr({ batched: s => writeOut(s + '\n', 'err') });
    py.runPython(PRELUDE);
    pyState = 'ready'; led.className = 'led ready'; lbl.textContent = T('ready');
    return py;
  }catch(e){
    pyState = 'fail'; led.className = 'led fail'; lbl.textContent = T('engineFail');
    return null;
  }
}
async function runCode(code, consoleEl, led, lbl){
  outTarget = consoleEl;
  consoleEl.querySelector('pre').textContent = '';
  const engine = await bootPy(led, lbl);
  if(!engine){ writeOut(T('engineFail'), 'err'); return; }
  led.className = 'led busy'; lbl.textContent = T('running');
  try{
    await engine.runPythonAsync(code);
  }catch(e){
    const msg = String(e.message || e);
    const lines = msg.trim().split('\n');
    writeOut(lines.slice(-3).join('\n') + '\n', 'err');
  }
  if(!consoleEl.querySelector('pre').textContent) writeOut('— ' + T('ready') + ' —', 'sys');
  led.className = 'led ready'; lbl.textContent = T('ready');
}

      :`<button class="btn btn-a" data-go="final">${T('finalTitle')} ★</button>`}
  </div>`;
}

/* ---------- quiz engine ---------- */
let QZ = null;
function quizHTML(qs, answers, checked){
  return qs.map((q,i) => {
    const sel = answers[i];
    return `<div class="q">
      <div class="q-h"><span class="q-n">${i+1}</span><p class="q-t">${tx(q.q)}</p></div>
      ${q.code ? codeBlock(q.code) : ''}
      <div class="opts">${q.o.map((o,j) => {
        const isTxt = typeof o === 'object';
        let cls = 'opt';
        if(checked){
          cls += ' locked';
          if(j === q.a) cls += ' right';
          else if(j === sel) cls += ' wrong';
        } else if(sel === j) cls += ' sel';
        return `<button class="${cls}" data-q="${i}" data-o="${j}">
          <span class="opt-k">${'ABCD'[j]}</span><span class="opt-v${isTxt?' txt':''}">${esc(tx(o))}</span></button>`;
      }).join('')}</div>
      ${checked ? `<div class="exp"><b>${T('correctAnswer')}: ${'ABCD'[q.a]}</b> — ${tx(q.e)}</div>` : ''}
    </div>`;
  }).join('');
}
function scoreRing(c, t){
  const p = Math.round(c / t * 100), dash = 2 * Math.PI * 37;
  return `<div class="score">
    <div class="ring"><svg viewBox="0 0 84 84"><circle class="bgc" cx="42" cy="42" r="37"/>
      <circle class="fg" cx="42" cy="42" r="37" stroke-dasharray="${dash}" stroke-dashoffset="${dash * (1 - p/100)}"
        style="stroke:${p>=75?'var(--ok)':p>=50?'var(--brand)':'var(--bad)'}"/></svg><b>${p}%</b></div>
    <div class="score-txt"><h3>${T('yourScore')}: ${c} ${T('correctOf')} ${t}</h3>
      <p>${p>=90?T('excellent'):p>=75?T('vgood'):p>=50?T('pass'):T('practice')}</p></div>
  </div>`;
}
function tabQuiz(L){
  if(!QZ || QZ.key !== L.id) QZ = { key:L.id, qs:L.quiz, ans:Array(L.quiz.length).fill(null), checked:false };
  const done = QZ.checked;
  const c = done ? QZ.qs.filter((q,i) => QZ.ans[i] === q.a).length : 0;
  return `<div class="blk"><h3>${T('quizTitle')}</h3><p>${T('quizIntro')}</p></div>
    ${done ? scoreRing(c, QZ.qs.length) : ''}
    <div class="card pad" style="margin-top:16px">${quizHTML(QZ.qs, QZ.ans, done)}</div>
    <div class="row">
      ${done ? `<button class="btn btn-g" id="btnRetry">${T('retryBtn')}</button>`
             : `<button class="btn btn-p" id="btnCheck">${T('checkBtn')}</button>`}
      ${done && S.idx < LESSONS.length-1 ? `<button class="btn btn-a" data-go="lesson" data-i="${S.idx+1}">${T('nextLesson')} →</button>` : ''}
      ${done ? `<button class="btn btn-g" data-go="report">${T('navReport')}</button>` : ''}
    </div>`;
}

/* ---------- final exam ---------- */
let EX = null;
function pickExam(){
  const pool = [];
  LESSONS.forEach((L,li) => L.quiz.forEach(q => pool.push({...q, _l:li})));
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  return pool.slice(0,40);
}
function viewFinal(){
  if(!EX) return `<div class="wrap">
    <span class="eyebrow">${T('navAssess')}</span>
    <h1 class="h-title">${T('finalTitle')}</h1><p class="h-sub">${T('finalLede')}</p>
    <div class="card pad" style="margin-top:24px">
      <div class="score" style="border:none;background:transparent;padding:0">
        <div class="tavatar" style="width:56px;height:56px;font-size:22px">★</div>
        <div class="score-txt"><h3>${T('examLen')}</h3>
        <p>${S.scores.__final ? `${T('yourScore')}: ${S.scores.__final.c} / ${S.scores.__final.t}` : T('notTaken')}</p></div>
      </div>
      <div class="row"><button class="btn btn-p" id="btnStartExam">${T('startExam')}</button></div>
    </div></div>`;
  const done = EX.checked;
  const c = done ? EX.qs.filter((q,i) => EX.ans[i] === q.a).length : 0;
  return `<div class="wrap">
    <h1 class="h-title">${T('finalTitle')}</h1>
    ${done ? scoreRing(c, EX.qs.length) : `<p class="h-sub">${T('examLen')}</p>`}
    <div class="card pad" style="margin-top:16px">${quizHTML(EX.qs, EX.ans, done)}</div>
    <div class="row">
      ${done ? `<button class="btn btn-g" id="btnExamRetry">${T('retryBtn')}</button>
                <button class="btn btn-p" data-go="report">${T('navReport')}</button>`
             : `<button class="btn btn-p" id="btnExamCheck">${T('checkBtn')}</button>`}
    </div></div>`;
}

/* ---------- report card ---------- */
function statusTag(p){
  if(p >= 90) return `<span class="tag a">${T('excellent')}</span>`;
  if(p >= 75) return `<span class="tag b">${T('vgood')}</span>`;
  if(p >= 50) return `<span class="tag c">${T('pass')}</span>`;
  return `<span class="tag d">${T('practice')}</span>`;
}
function viewReport(){
  const rows = LESSONS.map((L,i) => {
    const s = S.scores[L.id];
    const p = s ? Math.round(s.c / s.t * 100) : null;
    return `<tr>
      <td><b style="font-family:var(--mono);color:var(--dim);font-size:12px">${String(i+1).padStart(2,'0')}</b> &nbsp;${tx(L.t)}</td>
      <td style="font-family:var(--mono)">${s ? s.c + ' / ' + s.t : '—'}</td>
      <td><div style="display:flex;align-items:center;gap:9px"><div class="bar"><i style="width:${p||0}%;background:${p===null?'var(--border)':p>=75?'var(--ok)':p>=50?'var(--brand)':'var(--bad)'}"></i></div>
        <span style="font-family:var(--mono);font-size:12.5px;min-width:38px">${p===null?'—':p+'%'}</span></div></td>
      <td>${p===null ? `<span class="tag" style="background:var(--surface-2);color:var(--dim)">${T('notTaken')}</span>` : statusTag(p)}</td>
    </tr>`;
  }).join('');
  const taken = LESSONS.map(L => S.scores[L.id]).filter(Boolean);
  const fin = S.scores.__final;
  const allC = taken.reduce((a,s) => a + s.c, 0) + (fin ? fin.c : 0);
  const allT = taken.reduce((a,s) => a + s.t, 0) + (fin ? fin.t : 0);
  const avg = allT ? Math.round(allC / allT * 100) : 0;
  const today = new Date().toLocaleDateString(S.lang === 'fa' ? 'fa-IR' : 'en-GB');
  return `<div class="wrap">
    <span class="eyebrow">${T('navAssess')}</span>
    <h1 class="h-title">${T('reportTitle')}</h1><p class="h-sub">${T('reportLede')}</p>
    <div class="row noprint"><div class="field"><label>${T('studentName')}</label>
      <input id="stName" value="${esc(S.student)}" placeholder="${T('namePlaceholder')}"></div></div>

    <div class="card pad" style="margin-top:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:1.5px solid var(--border);padding-bottom:14px;margin-bottom:6px">
        <div><h3 style="font-size:17px">${S.student ? esc(S.student) : T('studentName')}</h3>
          <span style="font-size:12.5px;color:var(--dim)">${T('printedBy')}</span></div>
        <div style="text-align:end;font-size:12.5px;color:var(--dim)">${T('issued')}: ${today}</div>
      </div>
      ${allT === 0 ? `<div class="empty">${T('noResults')}</div>` : `
      <table class="rt"><thead><tr>
        <th>${T('colTopic')}</th><th>${T('colScore')}</th><th>${T('colPct')}</th><th>${T('colStatus')}</th>
      </tr></thead><tbody>${rows}
      <tr style="background:var(--surface-2)"><td><b>★ ${T('finalTitle')}</b></td>
        <td style="font-family:var(--mono)">${fin ? fin.c + ' / ' + fin.t : '—'}</td>
        <td><div style="display:flex;align-items:center;gap:9px"><div class="bar"><i style="width:${fin?Math.round(fin.c/fin.t*100):0}%;background:var(--accent)"></i></div>
          <span style="font-family:var(--mono);font-size:12.5px;min-width:38px">${fin?Math.round(fin.c/fin.t*100)+'%':'—'}</span></div></td>
        <td>${fin ? statusTag(Math.round(fin.c/fin.t*100)) : `<span class="tag" style="background:var(--surface-2);color:var(--dim)">${T('notTaken')}</span>`}</td></tr>
      </tbody></table>
      <div style="margin-top:20px">${scoreRing(allC, allT)}</div>
      <p style="font-size:12.5px;color:var(--dim);margin:12px 0 0">${T('gradeLine')} · ${avg}%</p>`}
    </div>
    <div class="row noprint">
      <button class="btn btn-p" id="btnPrint">${T('printBtn')}</button>
      <button class="btn btn-g" id="btnClear">${T('resetAll')}</button>
    </div></div>`;
}

/* ==================== RENDER ==================== */
function render(){
  applyChrome();
  if(S.view === 'home') main.innerHTML = viewHome();
  else if(S.view === 'final') main.innerHTML = viewFinal();
  else if(S.view === 'report') main.innerHTML = viewReport();
  else { main.innerHTML = viewLesson(); renderTab(); }
  buildNav();
  wire();
}
function renderTab(){
  const L = LESSONS[S.idx], body = $('#tabBody');
  if(!body) return;
  body.innerHTML = S.tab === 'learn' ? tabLearn(L) : S.tab === 'examples' ? tabExamples(L)
    : S.tab === 'play' ? tabPlay(L) : tabQuiz(L);
  if(S.tab === 'play') setupEditor(L);
  wire();
}
function setupEditor(L){
  const ed = $('#ed'), gut = $('#gut'), con = $('#con'), led = $('#led'), lbl = $('#ledLbl');
  ed.value = S.code[L.id] ?? L.ex[0].code;
  const sync = () => {
    const n = ed.value.split('\n').length;
    gut.innerHTML = Array.from({length:n}, (_,i) => i+1).join('<br>');
    gut.scrollTop = ed.scrollTop;
  };
  sync();
  ed.addEventListener('input', () => { sync(); S.code[L.id] = ed.value; save(); });
  ed.addEventListener('scroll', () => gut.scrollTop = ed.scrollTop);
  ed.addEventListener('keydown', e => {
    if(e.key === 'Tab'){ e.preventDefault();
      const s = ed.selectionStart, en = ed.selectionEnd;
      ed.value = ed.value.slice(0,s) + '    ' + ed.value.slice(en);
      ed.selectionStart = ed.selectionEnd = s + 4; sync(); S.code[L.id] = ed.value; save();
    }
  });
  if(pyState === 'ready'){ led.className = 'led ready'; lbl.textContent = T('ready'); }
  $('#btnRun').onclick = () => runCode(ed.value, con, led, lbl);
  $('#btnReset').onclick = () => { ed.value = L.ex[0].code; delete S.code[L.id]; save(); sync();
    con.querySelector('pre').textContent = T('consoleEmpty'); con.querySelector('pre').className = 'sys'; };
  $('#btnCopy').onclick = () => { navigator.clipboard?.writeText(ed.value); toast(T('copied')); };
  bootPy(led, lbl);
}

/* ==================== EVENTS ==================== */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.i ? +b.dataset.i : undefined));
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); renderTab(); });
  document.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
    S.code[LESSONS[S.idx].id] = b.dataset.load; save(); S.tab = 'play';
    document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === 'play'));
    renderTab(); $('#ed')?.focus();
  });
  document.querySelectorAll('.opt:not(.locked)').forEach(b => b.onclick = () => {
    const Q = S.view === 'final' ? EX : QZ; if(!Q || Q.checked) return;
    Q.ans[+b.dataset.q] = +b.dataset.o;
    b.parentElement.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
  });
  const check = $('#btnCheck');
  if(check) check.onclick = () => {
    if(QZ.ans.includes(null)) return toast(T('answerAll'));
    QZ.checked = true;
    const c = QZ.qs.filter((q,i) => QZ.ans[i] === q.a).length;
    S.scores[LESSONS[S.idx].id] = { c, t:QZ.qs.length }; save(); renderTab(); buildNav();
  };
  const retry = $('#btnRetry');
  if(retry) retry.onclick = () => { QZ = null; renderTab(); };
  const start = $('#btnStartExam');
  if(start) start.onclick = () => { EX = { qs:pickExam(), ans:Array(40).fill(null), checked:false }; render(); };
  const exCheck = $('#btnExamCheck');
  if(exCheck) exCheck.onclick = () => {
    if(EX.ans.includes(null)) return toast(T('answerAll'));
    EX.checked = true;
    const c = EX.qs.filter((q,i) => EX.ans[i] === q.a).length;
    S.scores.__final = { c, t:EX.qs.length }; save(); render();
  };
  const exRetry = $('#btnExamRetry');
  if(exRetry) exRetry.onclick = () => { EX = null; render(); };
  const nameIn = $('#stName');
  if(nameIn) nameIn.oninput = () => { S.student = nameIn.value; store.set('py.student', S.student); };
  const pr = $('#btnPrint'); if(pr) pr.onclick = () => window.print();
  const cl = $('#btnClear'); if(cl) cl.onclick = () => {
    if(confirm(T('confirmReset'))){ S.scores = {}; save(); QZ = null; EX = null; render(); }
  };
}
$('#themeBtn').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; store.set('py.theme', S.theme); applyChrome(); };
$('#langBtn').onclick = () => { S.lang = S.lang === 'en' ? 'fa' : 'en'; store.set('py.lang', S.lang); render(); };
$('#menuBtn').onclick = () => { rail.classList.toggle('open'); $('#scrim').classList.toggle('show'); };
$('#scrim').onclick = () => { rail.classList.remove('open'); $('#scrim').classList.remove('show'); };

render();
</script>
</body>
</html>
