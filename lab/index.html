er:0,explanation:"ابتدا ۴ ضرب در ۳ می‌شود ۱۲، سپس با ۲ جمع می‌شود که برابر ۱۴ خواهد بود."},{id:104,question:"کدام گزینه شکل باز شده (گسترده) عدد ۲۴۵,۰۳۰ است؟",options:["۲۰۰,۰۰۰ + ۴۰,۰۰۰ + ۵,۰۰۰ + ۳۰","۲۰۰,۰۰۰ + ۴,۰۰۰ + ۵۰۰ + ۳۰","۲۰۰,۰۰۰ + ۴۰,۰۰۰ + ۵,۰۰۰ + ۳۰۰","۲۰,۰۰۰ + ۴,۰۰۰ + ۵۰۰ + ۳"],correctAnswer:0,explanation:"رقم ۲ در صدگان هزار (۲۰۰,۰۰۰)، ۴ در دهگان هزار (۴۰,۰۰۰)، ۵ در یکان هزار (۵,۰۰۰) و ۳ در دهگان (۳۰) است."},{id:105,question:"عدد «چهارصد و پنج هزار و دوازده» به رقم چگونه نوشته می‌شود؟",options:["۴۵۰,۰۱۲","۴۰۵,۰۱۲","۴۰۵,۱۲۰","۴۵,۰۱۲"],correctAnswer:1,explanation:"۴۰۵ در طبقه هزار و ۰۱۲ در طبقه یکان قرار می‌گیرد، بنابراین ۴۰۵,۰۱۲ درست است."}]},{id:2,title:"فصل دوم: کسرها",subtitle:"مفهوم کسر، کسرهای مساوی، جمع و تفریق کسرها",description:"کسرها نشان‌دهنده قسمتی از یک کل هستند. در این شبیه‌ساز با تکه کردن پیتزا و شکل‌ها، کسرهای مساوی را کشف می‌کنید و یاد می‌گیرید چطور کسرها را با هم جمع یا تفریق کنید.",iconName:"PieChart",color:"bg-emerald-600",bgLight:"bg-emerald-50",borderColor:"border-emerald-200",goals:["درک مفهوم صورت و مخرج کسر","پیدا کردن کسرهای مساوی با ضرب صورت و مخرج","ساده کردن کسرها","جمع و تفریق کسرهایی با مخرج مساوی یا نامساوی"],quizzes:[{id:201,question:"کدام کسر با کسر ۲/۳ (دو سوم) مساوی است؟",options:["۴/۶","۳/۴","۴/۹","۵/۶"],correctAnswer:0,explanation:"اگر صورت و مخرج کسر ۲/۳ را در عدد ۲ ضرب کنیم، کسر ۴/۶ به دست می‌آید."},{id:202,question:"حاصل جمع دو کسر ۱/۵ + ۳/۵ چقدر می‌شود؟",options:["۴/۱۰","۴/۵","۳/۲۵","۲/۵"],correctAnswer:1,explanation:"چون مخرج‌ها مساوی هستند، صورت‌ها را جمع می‌کنیم: ۱+۳=۴ و مخرج ۵ ثابت می‌ماند."},{id:203,question:"اگر پیتزایی را به ۸ قسمت مساوی تقسیم کنیم و ۶ قسمت آن را بخوریم، چه کسری از پیتزا باقی مانده است؟",options:["۶/۸","۲/۸","۴/۸","۱/۸"],correctAnswer:1,explanation:"کل پیتزا ۸/۸ است. ۸/۸ منهای ۶/۸ برابر ۲/۸ (دو هشتم) است."},{id:204,question:"برای محاسبه ۱/۲ + ۱/۴، ابتدا باید چه کاری انجام دهیم؟",options:["صورت‌ها را با هم و مخرج‌ها را با هم جمع کنیم","کسر ۱/۲ را به کسر مساوی با مخرج ۴ تبدیل کنیم (۲/۴)","مخرج‌ها را در هم ضرب کنیم و صورت‌ها را صفر کنیم","نمی‌توان این دو کسر را جمع کرد"],correctAnswer:1,explanation:"برای جمع کسرها باید مخرج‌ها مشترک باشند. پس ۱/۲ را با ضرب در ۲ به ۲/۴ تبدیل می‌کنیم."},{id:205,question:"کسر ۱۲/۱۶ را اگر به ساده‌ترین شکل بنویسیم، کدام کسر می‌شود؟",options:["۳/۴","۶/۸","۴/۵","۲/۳"],correctAnswer:0,explanation:"صورت و مخرج هر دو بر ۴ بخش‌پذیرند. ۱۲ تقسیم بر ۴ می‌شود ۳، و ۱۶ تقسیم بر ۴ می‌شود ۴."}]},{id:3,title:"فصل سوم: ضرب و تقسیم",subtitle:"ضرب اعداد چند رقمی، جدول مساحتی و تقسیم با باقیمانده",description:"در این فصل روش‌های پیشرفته ضرب دو عدد چند رقمی (مساحتی و تکنیکی) را تمرین می‌کنیم. همچنین مفهوم تقسیم، خارج قسمت و باقیمانده را با سبدهای میوه شبیه‌سازی می‌کنیم.",iconName:"Grid2X2",color:"bg-amber-600",bgLight:"bg-amber-50",borderColor:"border-amber-200",goals:["ضرب اعداد دو رقمی در دو رقمی به کمک جدول مساحت","آشنایی با خاصیت‌های ضرب","تقیم اعداد بر اعداد یک رقمی و دو رقمی","درک رابطه تقسیم (خارج قسمت × مقسوم علیه + باقیمانده = مقسوم)"],quizzes:[{id:301,question:"در محاسبه ضرب ۱۵ × ۲۳ به روش مساحتی، عدد ۲۳ به چه قسمتهایی باز می‌شود؟",options:["۲۰ و ۳","۱۰ و ۱۳","۲ و ۳","۲۳ و ۱"],correctAnswer:0,explanation:"برای ساده شدن محاسبه، ۲۳ را به دهگان خالص (۲۰) و یکان (۳) تفکیک می‌کنیم."},{id:302,question:"اگر ۴۷ دانه سیب را در ۵ سبد به طور مساوی تقسیم کنیم، چند سیب در هر سبد قرار می‌گیرد و چند سیب باقی می‌ماند؟",options:["۸ سیب در هر سبد، ۷ باقی‌مانده","۹ سیب در هر سبد، ۲ باقی‌مانده","۹ سیب در هر سبد، بدون باقی‌مانده","۷ سیب در هر سبد، ۱۲ باقی‌مانده"],correctAnswer:1,explanation:"۹ ضرب در ۵ می‌شود ۴۵. بنابراین در هر سبد ۹ سیب می‌رسد و ۲ سیب باقی می‌ماند (۴۷ - ۴۵ = ۲)."},{id:303,question:"در هر تقسیم، باقیمانده باید چه ارتباطی با مقسوم علیه (تقسیم‌کننده) داشته باشد؟",options:["باقیمانده باید بزرگتر از مقسوم علیه باشد","باقیمانده باید مساوی مقسوم علیه باشد","باقیمانده باید کوچکتر از مقسوم علیه باشد","هیچ قانونی وجود ندارد"],correctAnswer:2,explanation:"اگر باقیمانده مساوی یا بزرگتر از مقسوم علیه باشد، یعنی می‌توانستیم یک بسته دیگر هم جدا کنیم!"},{id:304,question:"حاصل ضرب ۳۰ × ۴۰ چقدر است؟",options:["۱۲۰","۱,۲۰۰","۱۲,۰۰۰","۷۰"],correctAnswer:1,explanation:"کافیست ۳ را در ۴ ضرب کنیم (۱۲) و دو صفر به سمت راست آن اضافه کنیم (۱,۲۰۰)."},{id:305,question:"در عبارت رابطه تقسیم « ( ۸ × ۵ ) + ۳ = ۴۳ »، عدد ۳ چه نام دارد؟",options:["مقسوم","مقسوم علیه","خارج قسمت","باقیمانده"],correctAnswer:3,explanation:"عدد ۴۳ مقسوم، ۵ مقسوم علیه، ۸ خارج قسمت و ۳ باقیمانده است."}]},{id:4,title:"فصل چهارم: زاویه و زمان",subtitle:"کار با نقاله، انواع زاویه‌ها و محاسبه زاویه عقربه‌های ساعت",description:"زاویه‌ها دنیای معماری و جهت‌ها را می‌سازند! با نقاله مجازی کار کنید، زاویه‌های تند، باز و راست (قائمه) بسازید و اختلاف ساعت‌ها و زاویه بین عقربه‌ها را اندازه بگیرید.",iconName:"Clock",color:"bg-rose-600",bgLight:"bg-rose-50",borderColor:"border-rose-200",goals:["شناخت انواع زاویه: تند (حاده)، راست (قائمه)، باز (منفرجه) و نیم‌صفحه","اندازه‌گیری زاویه به کمک نقاله بر حسب درجه","خواندن ساعت و محاسبه تفاوت دو زمان","درک زاویه بین عقربه‌های ساعت"],quizzes:[{id:401,question:"زاویه‌ای که اندازه آن ۷۵ درجه باشد، چه نوع زاویه‌ای است؟",options:["زاویه راست (قائمه)","زاویه باز (منفرجه)","زاویه تند (حاده)","زاویه نیم‌صفحه"],correctAnswer:2,explanation:"زاویه‌های کمتر از ۹۰ درجه را زاویه تند (حاده) می‌نامند."},{id:402,question:"ساعت دقیقا ۳:۰۰ را نشان می‌دهد. زاویه بین عقربه ساعت‌شمار و دقیقه‌شمار چند درجه است؟",options:["۴۵ درجه","۹۰ درجه","۱۸۰ درجه","۶۰ درجه"],correctAnswer:1,explanation:"فاصله هر عدد روی ساعت ۳۰ درجه است. فاصله ۱۲ تا ۳ برابر ۳ × ۳۰ = ۹۰ درجه (زاویه راست) است."},{id:403,question:"زاویه نیم‌صفحه چند درجه است؟",options:["۹۰ درجه","۱۸۰ درجه","۲۷۰ درجه","۳۶۰ درجه"],correctAnswer:1,explanation:"یک صفحه کامل ۳۶۰ درجه و نیم‌صفحه (خط راست) دقیقا ۱۸۰ درجه است."},{id:404,question:"علی ساعت ۷:۱۵ صبح از خانه خارج شد و ساعت ۷:۵۰ به مدرسه رسید. او چند دقیقه در راه بوده است؟",options:["۲۵ دقیقه","۳۵ دقیقه","۴۵ دقیقه","۳۰ دقیقه"],correctAnswer:1,explanation:"تفاضل ۵۰ دقیقه و ۱۵ دقیقه برابر ۳۵ دقیقه است."},{id:405,question:"اگر زاویه‌ای ۱۲۰ درجه باشد، برای تبدیل شدن به زاویه نیم‌صفحه، به چند درجه دیگر نیاز دارد؟",options:["۶۰ درجه","۹۰ درجه","۴۰ درجه","۳۰ درجه"],correctAnswer:0,explanation:"زاویه نیم‌صفحه ۱۸۰ درجه است. ۱۸۰ منهای ۱۲۰ برابر ۶۰ درجه است."}]},{id:5,title:"فصل پنجم: عدد مخلوط و عدد اعشاری",subtitle:"درک اعداد مخلوط، مفهوم دهم و صدم در اعداد اعشاری",description:"گاهی مقدارها کامل نیستند؛ مثل ۲ بشقاب کامل و یک تکه! در این بخش یاد می‌گیریم اعداد مخلوط چیستند و چگونه کسرهایی با مخرج ۱۰ و ۱۰۰ را به صورت عدد اعشاری (با ممیز) بنویسیم.",iconName:"Inspect",color:"bg-purple-600",bgLight:"bg-purple-50",borderColor:"border-purple-200",goals:["شناخت عدد مخلوط (ترکیب عدد صحیح و کسر)","تبدیل کسر بزرگتر از واحد به عدد مخلوط و برعکس","معرفی ممیز اعشاری برای دهم و صدم","ارتباط بین جدول ارزش مکانی و اعشار"],quizzes:[{id:501,question:"عدد مخلوط «۲ صحیح و ۱/۳» به صورت کسر بزرگتر از واحد کدام است؟",options:["۷/۳","۵/۳","۶/۳","۸/۳"],correctAnswer:0,explanation:"مخرج (۳) را در عدد صحیح (۲) ضرب کرده و با صورت (۱) جمع می‌کنیم: (۲×۳)+۱ = ۷. مخرج ثابت است: ۷/۳."},{id:502,question:"کسر ۷/۱۰ به صورت عدد اعشاری چگونه نوشته می‌شود؟",options:["۰/۰۷","۰/۷","۷/۰","۰/۰۷۰"],correctAnswer:1,explanation:"چون مخرج ۱۰ است، یک رقم بعد از ممیز داریم که می‌شود ۰/۷ (صفر ممیز هفت دهم)."},{id:503,question:"در عدد اعشاری «۴/۳۸»، رقم ۸ در چه مرتبه‌ای قرار دارد؟",options:["دهم","یکان","صدم","دهگان"],correctAnswer:2,explanation:"رقم ۴ در یکان، ۳ در مرتبه دهم و ۸ در مرتبه صدم قرار دارد."},{id:504,question:"کدام گزینه نشان‌دهنده کسر ۱۵/۱۰۰ است؟",options:["۱/۵","۰/۰۱۵","۰/۱۵","۱۵/۰"],correctAnswer:2,explanation:"پانزده صدم، یعنی دو رقم بعد از ممیز: ۰/۱۵."},{id:505,question:"مقدار ۳/۵ (سه ممیز پنج دهم) برابر با کدام عدد مخلوط است؟",options:["۳ صحیح و ۵/۱۰","۵ صحیح و ۳/۱۰","۳ صحیح و ۵/۱۰۰","۳۵ صحیح و ۱/۱۰"],correctAnswer:0,explanation:"عدد ۳ در قسمت صحیح و ۵ در مرتبه دهم (۵/۱۰) قرار دارد."}]},{id:6,title:"فصل ششم: شکل‌های هندسی",subtitle:"خاصیت‌های چهارضلعی‌ها، محاسبه محیط و مساحت",description:"چهارضلعی‌ها (مربع، مستطیل، متوازی‌الاضلاع، ذوزنقه و لوزی) رازهای جالبی دارند. در صفحه مشبک (جئوبورد) شکل بسازید، قطرها را بررسی کنید و محیط و مساحت را محاسبه کنید.",iconName:"Shapes",color:"bg-indigo-600",bgLight:"bg-indigo-50",borderColor:"border-indigo-200",goals:["شناخت ویژگی‌های متوازی‌الاضلاع، مستطیل، لوزی و ذوزنقه","کار با مفهوم خطوط موازی و عمود بر هم","محاسبه محیط (دور تا دور) شکل‌ها","محاسبه مساحت (کف‌پوش) شکل‌های مختلف"],quizzes:[{id:601,question:"تفاوت اصلی مربع و لوزی در چیست؟",options:["ضلع‌های مربع برابرند ولی لوزی برابر نیستند","زاویه‌های مربع ۹۰ درجه‌اند ولی در لوزی لزوماً ۹۰ درجه نیستند","لوزی ۴ ضلع دارد ولی مربع ۳ ضلع دارد","هیچ تفاوتی ندارند"],correctAnswer:1,explanation:"در هر دو شکل ۴ ضلع برابرند، اما در مربع حتماً هر ۴ زاویه قائمه (۹۰ درجه) هستند."},{id:602,question:"محیط مستطیلی با طول ۶ متر و عرض ۴ متر چقدر است؟",options:["۲۴ متر","۲۰ متر","۱۰ متر","۱۲ متر"],correctAnswer:1,explanation:"محیط مستطیل = (طول + عرض) × ۲. پس (۶+۴)×۲ = ۲۰ متر."},{id:603,question:"مساحت مستطیلی با طول ۵ سانتی‌متر و عرض ۳ سانتی‌متر چقدر است؟",options:["۱۵ سانتی‌متر مربع","۱۶ سانتی‌متر مربع","۸ سانتی‌متر مربع","۳۰ سانتی‌متر مربع"],correctAnswer:0,explanation:"مساحت مستطیل = طول × عرض. پس ۵ × ۳ = ۱۵ سانتی‌متر مربع."},{id:604,question:"در کدام چهارضلعی، ضلع‌های روبه‌رو موازی و مساوی هستند ولی زاویه‌ها قائمه نیستند؟",options:["مربع","مستطیل","متوازی‌الاضلاع","ذوزنقه"],correctAnswer:2,explanation:"در متوازی‌الاضلاع ضلع‌های مجاور زاویه تند و باز می‌سازند و لزوماً قائمه نیستند."},{id:605,question:"فرمول مساحت متوازی‌الاضلاع کدام است؟",options:["طول × عرض","قاعده × ارتفاع","(قاعده × ارتفاع) تقسیم بر ۲","ضلع × ۴"],correctAnswer:1,explanation:"مساحت متوازی‌الاضلاع برابر است با حاصل ضرب قاعده در ارتفاع نظیر آن."}]},{id:7,title:"فصل هفتم: آمار و احتمال",subtitle:"نمودار ستونی، بررسی شانس و کار با چرخنده احتمال",description:"چگونه اطلاعات را دسته‌بندی کنیم و شانس وقوع اتفاقات را بسنجیم؟ در این آزمایشگاه با چرخنده شانس کار می‌کنید، نتایج را ثبت می‌کنید و یاد می‌گیرید نمودار ستونی رسم کنید.",iconName:"BarChart3",color:"bg-teal-600",bgLi
