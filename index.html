<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Simulators ShowCase</title>
<meta name="description" content="ویترین شبیه‌سازهای آموزشی و پژوهشی — ورود به آزمایشگاه مجازی">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#2b333d;
    --text:#e6edf3;
    --muted:#9aa7b4;
    --accent:#2f81f7;
    --accent-hover:#4b95f9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Tahoma,"Iranian Sans",system-ui,-apple-system,sans-serif;
    line-height:1.9;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  main{width:100%;max-width:680px;text-align:center}
  h1{font-size:clamp(24px,5vw,34px);margin:0 0 8px}
  .sub{color:var(--muted);margin:0 0 32px;font-size:15px}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:32px 24px;
  }
  .card h2{margin:0 0 8px;font-size:20px}
  .card p{margin:0 0 24px;color:var(--muted);font-size:15px}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-size:17px;
    font-weight:600;
    padding:14px 40px;
    border-radius:10px;
    transition:background .15s ease;
  }
  .btn:hover,.btn:focus-visible{background:var(--accent-hover)}
  .hint{margin-top:20px;font-size:13px;color:var(--muted)}
  footer{margin-top:36px;font-size:13px;color:var(--muted)}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Smart Simulators ShowCase</h1>
  <p class="sub">شبیه‌سازی‌های تعاملی آموزشی، پژوهشی و آزمایشگاهی</p>

  <div class="card">
    <h2>آزمایشگاه مجازی</h2>
    <p>برای اجرای شبیه‌ساز و کار با آزمایشگاه مجازی، روی دکمهٔ زیر کلیک کنید.</p>
    <a class="btn" href="simulator.html">ورود به شبیه‌ساز</a>
    <p class="hint">شبیه‌ساز در مرورگر اجرا می‌شود و نیازی به نصب چیزی نیست.</p>
  </div>

  <footer>
    <a href="https://github.com/Fatemeh1203/Smart-Simulators-ShowCase">مشاهدهٔ مخزن روی GitHub</a>
  </footer>
</main>
</body>
</html>
