ه و جابه‌جایی",minutes:14,xp:50,goals:["خواندن مختصات","قرار دادن نقطه","مقایسه موقعیت"],theory:[{title:"نقطه یعنی چه؟",body:"نقطه A(2, 3) یعنی از مبدأ ۲ واحد به راست و ۳ واحد به بالا برویم. مختص اول همیشه افقی و مختص دوم همیشه عمودی است."},{title:"علامت‌ها را جدی بگیر",body:"x منفی یعنی چپِ مبدأ، y منفی یعنی پایینِ مبدأ. جابه‌جا کردن نقطه روی نمودار بهتر از حفظ کردن است."}],insight:"نقطه را بکش و ببین مختصات همان لحظه عوض می‌شود."},{id:"line",index:3,title:"مفهوم خط",subtitle:"خط راست در صفحه مختصات",minutes:12,xp:60,goals:["تشخیص خط راست","نقاط روی خط","امتداد نامحدود"],theory:[{title:"خط از بی‌نهایت نقطه ساخته می‌شود",body:"خط راست در هر دو جهت تا بی‌نهایت ادامه دارد. اگر دو نقطه داشته باشیم، فقط یک خط راست از آن دو نقطه می‌گذرد."},{title:"نقطه روی خط",body:"اگر نقطه‌ای روی خط باشد، مختصاتش در معادله خط صدق می‌کند. این ایده را بعداً در معادله خط می‌بینیم."}],insight:"دو نقطه خط را می‌سازند. نقطه سوم یا روی همان خط است یا نیست."},{id:"slope",index:4,title:"شیب خط",subtitle:"تغییر y نسبت به تغییر x",minutes:18,xp:80,formula:"m = Δy / Δx",goals:["محاسبه Δx و Δy","فهم نسبت شیب","کسر شیب"],theory:[{title:"شیب یعنی تندی خط",body:"شیب نشان می‌دهد وقتی x به اندازه یک واحد زیاد می‌شود، y چقدر تغییر می‌کند. شیب را با m نشان می‌دهیم."},{title:"فرمول شیب",body:"اگر دو نقطه A(x₁, y₁) و B(x₂, y₂) داشته باشیم، شیب برابر است با m = (y₂ − y₁) / (x₂ − x₁). صورت کسر بالا رفتن و مخرج کسر جلو رفتن است."}],insight:"مثلث شیب را ببین: ارتفاع همان Δy و قاعده همان Δx است."},{id:"slope-sign",index:5,title:"شیب مثبت و منفی",subtitle:"صعود، نزول و علامت شیب",minutes:14,xp:70,goals:["تشخیص صعودی","تشخیص نزولی","ربط علامت و جهت"],theory:[{title:"از چپ به راست نگاه کن",body:"اگر خط از چپ به راست بالا برود شیب مثبت است. اگر پایین بیاید شیب منفی است. علامت شیب جهت حرکت را فاش می‌کند."},{title:"عدد بزرگ‌تر یعنی تندتر",body:"شیب ۴ از شیب ۱ تندتر است. شیب −۳ از شیب −۱ تندتر نزول می‌کند. قدرمطلق شیب، تندی را می‌گوید."}],insight:"علامت شیب را قبل از محاسبه حدس بزن؛ بعد با فرمول چک کن."},{id:"hv",index:6,title:"خط افقی و عمودی",subtitle:"شیب صفر و شیب تعریف‌نشده",minutes:12,xp:70,goals:["خط افقی","خط عمودی","معادله x = a و y = b"],theory:[{title:"خط افقی",body:"روی خط افقی مقدار y ثابت است و Δy برابر صفر می‌شود. پس شیب صفر است و معادله به صورت y = b نوشته می‌شود."},{title:"خط عمودی",body:"روی خط عمودی مقدار x ثابت است و Δx برابر صفر می‌شود. تقسیم بر صفر ممکن نیست؛ شیب تعریف نشده است. معادله به صورت x = a است."}],insight:"اگر نتوانستی شیب را حساب کنی، اول ببین خط عمودی است یا نه."},{id:"equation",index:7,title:"معادله خط",subtitle:"رابطه بین x و y",minutes:16,xp:80,goals:["معادله به عنوان قانون","صدق کردن نقطه","جدول مقادیر"],theory:[{title:"معادله یعنی قانون خط",body:"معادله خط قانونی است که به ازای هر x، مقدار y را مشخص می‌کند. همه نقاطی که در این قانون صدق کنند روی همان خط هستند."},{title:"آزمایش نقطه",body:"برای فهمیدن اینکه نقطه روی خط هست یا نه، x و y را در معادله بگذار. اگر تساوی برقرار شد، نقطه روی خط است."}],insight:"معادله را با جدول مقادیر و نمودار همزمان ببین."},{id:"slope-intercept",index:8,title:"فرم شیب-عرض از مبدأ",subtitle:"y = mx + b",minutes:18,xp:90,formula:"y = mx + b",goals:["شناخت m","شناخت b","تغییر لغزنده و مشاهده خط"],theory:[{title:"m شیب است",body:"در معادله y = mx + b، ضریب x همان شیب خط است. اگر m را زیاد کنی خط تندتر می‌شود."},{title:"b محل عبور از محور y است",body:"عرض از مبدأ همان نقطه‌ای است که خط محور y را قطع می‌کند: (0, b). با تغییر b خط بالا و پایین می‌رود بدون اینکه شیب عوض شود."}],insight:"لغزنده‌ها را حرکت بده تا ببینی m خط را می‌چرخاند و b آن را جابه‌جا می‌کند."},{id:"two-points",index:9,title:"معادله از روی دو نقطه",subtitle:"از نقاط تا معادله",minutes:20,xp:100,formula:"m = (y₂ − y₁)/(x₂ − x₁)",goals:["محاسبه شیب","یافتن b","نوشتن معادله نهایی"],theory:[{title:"پنج گام",body:"۱) Δx و Δy را حساب کن. ۲) شیب را به دست آور. ۳) فرم y = mx + b را بنویس. ۴) یکی از نقاط را جایگذاری کن. ۵) b را پیدا کن و معادله را کامل کن."},{title:"هر دو نقطه باید صدق کنند",body:"بعد از نوشتن معادله، نقطه دوم را هم آزمایش کن. اگر صدق نکرد، در محاسبه b یا علامت شیب اشتباه رخ داده است."}],insight:"حل مرحله‌ای را دنبال کن؛ جواب نهایی بدون مسیر، یادگیری نمی‌سازد."},{id:"graph-eq",index:10,title:"رسم خط از روی معادله",subtitle:"از فرمول تا نمودار",minutes:16,xp:80,goals:["یافتن دو نقطه","استفاده از b","رسم دقیق"],theory:[{title:"یک نقطه رایگان داری",body:"عرض از مبدأ نقطه (0, b) را می‌دهد. نقطه دوم را با حرکت شیب بساز: از آن نقطه Δx به راست و Δy بالا یا پایین برو."},{title:"جدول کوچک",body:"سه مقدار برای x انتخاب کن، y را حساب کن و نقاط را مشخص کن. اگر هر سه روی یک راستا بودند، محاسبه درست است."}],insight:"برای رسم، دو نقطه کافی است؛ نقطه سوم برای کنترل است."},{id:"convert",index:11,title:"تبدیل معادله",subtitle:"رسیدن به فرم مناسب",minutes:16,xp:80,goals:["آزاد کردن y","خواندن شیب","خواندن عرض از مبدأ"],theory:[{title:"هدف: y تنها بماند",body:"اگر معادله به صورت ax + by = c باشد، y را تنها کن تا به y = mx + b برسی. آن وقت شیب و عرض از مبدأ را فوری می‌خوانی."},{title:"علامت‌ها را گم نکن",body:"وقتی طرفین را تقسیم می‌کنی، هم ضریب x و هم عدد ثابت تقسیم می‌شوند. اشتباه رایج فراموش کردن تقسیم عدد ثابت است."}],insight:"اول y را آزاد کن، بعد نمودار را بکش."},{id:"two-lines",index:12,title:"رابطه بین دو خط",subtitle:"موازی، متقاطع، منطبق",minutes:18,xp:90,goals:["مقایسه شیب","تشخیص توازی","یافتن نقطه برخورد"],theory:[{title:"شیب یکسان",body:"اگر دو خط شیب برابر داشته باشند و عرض از مبدأ متفاوت باشد، موازی‌اند و هرگز برخورد نمی‌کنند."},{title:"شیب متفاوت",body:"اگر شیب‌ها فرق داشته باشند، خط‌ها دقیقاً در یک نقطه متقاطع‌اند. اگر شیب‌ها برابر و b هم برابر باشد، دو خط منطبق‌اند."}],insight:"قبل از حل دستگاه، فقط شیب‌ها را مقایسه کن."},{id:"mixed",index:13,title:"مسائل ترکیبی",subtitle:"همه مهارت‌ها کنار هم",minutes:22,xp:120,goals:["ترکیب مفاهیم","تحلیل خطا","حل چندگامی"],theory:[{title:"مسئله واقعی چند لایه است",body:"ممکن است دو نقطه بدهند، معادله بخواهند، بعد بپرسند آیا نقطه سوم روی خط هست و آیا با خط دیگری موازی است."},{title:"مسیر فکر",body:"همیشه بپرس: چه دارم؟ چه می‌خواهم؟ کدام ابزار (شیب، معادله، نمودار) کوتاه‌تری
